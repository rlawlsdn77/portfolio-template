<!-- temp1 전용 발표 덱: temp1/deck.html?p=<src 폴더 이름>
     원본 발표 덱(../project.html)과 같은 렌더러·같은 데이터를 쓰고, theme/theme.css 대신 temp1/deck-theme.css(종이 카탈로그 색)와
     temp1/deck-layout.css(종이 카탈로그 배치 — 왼쪽 책등·오른쪽 라벨 칸 머리·도판 표지·세리프 장 번호)를 싣습니다.
     <base href="../">로 모든 상대 주소(assets/ · data/ · src/ · theme/strings.tsv · doc.html)가 레포 맨 위를 가리킵니다.
     원본 project.html의 머리가 바뀌면(/portfolio-update) 아래 목록을 그 파일과 맞춰 주세요 — 다른 점은 base · 테마·배치 줄 · 맨 아래 temp1 스크립트뿐입니다. -->

<link rel="icon" href="data:," />

<p class="pf-loading pf-screen-only" data-pf-ui="loading" data-pf-loading>불러오는 중…</p>
<main class="pf-deck" id="deck" aria-label="프로젝트 발표 덱"><noscript><section class="pf-scene pf-bare t-msg"><div class="pf-body"><div class="msg"><h1>JavaScript를 켜 주세요</h1><div class="msg-b"><p>이 발표 덱은 data/의 내용을 읽어 브라우저에서 그립니다. JavaScript를 켠 뒤 다시 열어 주세요.</p></div></div></div></section></noscript></main>
<script src="assets/strings.js"></script>
<script src="assets/common.js"></script>
<script src="assets/md-blocks.js"></script>
<script src="assets/deck-common.js"></script>
<script src="assets/deck-pptx.js"></script>
<script src="assets/project-deck.js"></script>
<script>
/* temp1 전용: 덱 안의 [← 포트폴리오] 링크(index.html)를 temp1 페이지로 돌립니다.
   <base href="../"> 때문에 그대로 두면 원본 포트폴리오(맨 위 index.html)로 갑니다. 상세 문서 링크(doc.html)는 원본 그대로입니다.
   카드에 보이는 주소 글자는 렌더러가 이 페이지의 폴더(temp1/)로 만들므로, 상세 문서·발표 덱 주소만 실제 주소로 고쳐 씁니다. */
(() => {
  const BACK = 'temp1/';
  const SEL = 'a[href="index.html"]';
  const fixUrl = (t) => t.replace('/temp1/doc.html', '/doc.html').replace('/temp1/project.html', '/temp1/deck.html');
  const fix = () => {
    document.querySelectorAll(SEL).forEach((a) => a.setAttribute('href', BACK));
    document.querySelectorAll('.url').forEach((e) => { if (e.children.length) return; const t = e.textContent, n = fixUrl(t); if (n !== t) e.textContent = n; });
  };
  const onClick = (e) => { const a = e.target.closest && e.target.closest(SEL); if (a) a.setAttribute('href', BACK); };
  document.addEventListener('click', onClick, true);
  document.addEventListener('auxclick', onClick, true);
  new MutationObserver(fix).observe(document.body, { childList: true, subtree: true });
  fix();
})();
</script>
</body>
</html>
