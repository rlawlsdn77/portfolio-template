<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포트폴리오</title>
<!-- /portfolio-custom 직접 생성 모드(temp3) — "카트리지 & 설명서": 8비트 가정용 게임기 시절의 카트리지·본체·설명서·컨트롤러를 빌려 온 밝은 크림 톤 페이지.
     흐름(아래로 읽는 한 페이지 — 스냅 없음):
       01 PLAYER   — 커다란 카트리지 한 개 = 자기소개(이름·한 줄 소개·소개 글·연락처)
       02 SOFTWARE — 선반의 카트리지(프로젝트마다 하나)를 누르거나 끌어다 본체에 꽂으면 TV가 켜지고 옆 창에 그 프로젝트 정보. ◀ ▶ 로 바꿔 꽂기
       03 MANUAL   — 꽂은 소프트의 취급 설명서(펼친 책): 게임 소개 · 목차 · 기능 소개 · 문제 해결(곤란할 때는) · 결과 · 스크린샷. ◀ ▶ · 모서리 · 옆 색인으로 넘김
       04 SPEC     — 기술 스택을 본체 명판처럼. 근거 프로젝트 칩(카트리지 색)을 누르면 그 소프트를 꽂음
       05 CONTROLLER — 연락처: 컨트롤러 버튼(A 메일 · B GitHub · START 포트폴리오 PDF · SELECT 처음으로) + 글자 목록
     내용은 ../data/*.json(기능 = highlights, 문제 해결 = troubleshooting, 결과 = retro.achieved, 스크린샷 = screenshots), UI 문구는 ../theme/strings.tsv.
     SOFT·PLAYER·NOW PLAYING 같은 게임기 라벨과 "취급 설명서·곤란할 때는" 같은 장식 문구는 이 파일에 적혀 있음(문구 표에 없는 temp3 전용 라벨).
     카트리지 껍데기 색은 프로젝트 순서대로 SHELLS(아래 스크립트)에서 돌려 씀 — temp3/deck.html도 같은 순서·같은 색.
     실제 게임기·회사의 이름·로고는 쓰지 않습니다(모양과 색 인상만).
     색: 바탕 크림 --bg · 글자 --ink · 강조 마룬 --acc (+ 금색 띠 --gold는 장식 줄에만).
     배치 원칙: ../theme/layout-principles.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #ECE5D5;
    --bg2: #E2D9C5;
    --paper: #FBF8F0;
    --ink: #23201C;
    --body: #474038;
    --muted: #6B6256;
    --line: #D7CCB6;
    --line2: #B0A48C;
    --acc: #8E1F2E;
    --acc-deep: #63141F;
    --acc-soft: color-mix(in srgb, var(--acc) 9%, var(--paper));
    --gold: #B98A2E;
    --cream: #F6EEDD;
    --tv: #2B2825;
    --screen: #0C0B0A;
    --sans: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --disp: 'Archivo', 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    --pix: 'Galmuri11', 'Pretendard Variable', Pretendard, monospace;
    --mono: ui-monospace, 'D2Coding', Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --stripes: linear-gradient(var(--acc) 0 5px, transparent 5px 7px, var(--gold) 7px 10px);
  }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
         word-break: keep-all; overflow-wrap: break-word; }   /* 한글은 낱말 단위로만 꺾음(레이아웃 원칙 2) */
  body.lb-open { overflow: hidden; }
  ::selection { background: var(--acc); color: var(--cream); }
  a:focus-visible, button:focus-visible { outline: 2px dashed var(--acc); outline-offset: 3px; }
  .disp { font-family: var(--disp); font-stretch: 125%; }
  .muted { color: var(--muted); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 768px) { .wrap { padding: 0 40px; } }
  .sec { padding: 64px 0; }
  .sec + .sec { border-top: 1px solid var(--line); }
  .ic { font-family: var(--mono); font-size: .88em; padding: 1px 5px; border-radius: 4px; background: rgb(35 32 28 / .07); color: var(--ink); }
  .blink { animation: blink 1.1s steps(1) infinite; }

  /* ── 버튼: 플라스틱 키(누르면 아래로 꺼짐) ── */
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line2);
         background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 700; white-space: nowrap; box-shadow: 0 3px 0 var(--line2);
         transition: transform .08s, box-shadow .08s, background-color .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background: #fff; border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .btn.pri { background: var(--acc); border-color: var(--acc-deep); color: var(--cream); box-shadow: 0 3px 0 var(--acc-deep); }
  .btn.pri:hover:not(:disabled) { background: #A12537; border-color: var(--acc-deep); box-shadow: 0 3px 0 var(--acc-deep); }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 7px; }
  .btn:disabled { opacity: .45; }
  .ext { font-family: var(--sans); font-weight: 600; }
  kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; margin: 0 1px; border-radius: 5px;
        border: 1px solid var(--line2); background: var(--paper); box-shadow: 0 2px 0 var(--line2); font: 700 11px/1 var(--sans); color: var(--ink); }

  /* ── 절 머리 ── */
  .shead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px; margin-bottom: 28px; }
  .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0; font-family: var(--disp); font-stretch: 125%; font-weight: 800; font-size: 12px; letter-spacing: .16em;
             text-transform: uppercase; color: var(--acc); }
  .eyebrow .sn { display: inline-flex; align-items: center; justify-content: center; height: 22px; padding: 0 7px; border-radius: 5px; background: var(--ink); color: var(--cream);
                 letter-spacing: .06em; font-size: 11px; box-shadow: 0 3px 0 -1px var(--gold); }
  .stitle { margin: 12px 0 0; font-size: clamp(30px, 4vw, 42px); font-weight: 900; line-height: 1.12; letter-spacing: -.03em; }
  .shint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13.5px; color: var(--muted); }
  .shint b { color: var(--ink); }
  .stripes { height: 10px; background: var(--stripes); }

  /* ── 머리 막대 ── */
  .top { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
         -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .topin { display: flex; align-items: center; gap: 24px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand b { font-size: 16px; font-weight: 800; white-space: nowrap; }
  .brand .en { font-family: var(--disp); font-stretch: 125%; font-weight: 700; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--acc); white-space: nowrap; }
  .mini { display: inline-block; flex: none; width: 24px; height: 19px; border-radius: 4px 4px 3px 3px;
          background: linear-gradient(var(--paper), var(--paper)) 4px 8px / 16px 8px no-repeat,
                      repeating-linear-gradient(to bottom, rgb(255 255 255 / .4) 0 1px, transparent 1px 3px) 6px 2px / 12px 5px no-repeat, var(--shell, var(--acc)); }
  .topnav { display: none; align-items: center; gap: 22px; margin-left: auto; }
  @media (min-width: 900px) { .topnav { display: flex; } }
  .topnav a { position: relative; display: inline-flex; align-items: center; height: 60px; font-size: 14px; font-weight: 700; color: var(--muted); transition: color .15s; }
  .topnav a:hover { color: var(--ink); }
  .topnav a.on { color: var(--ink); }
  .topnav a.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: 14px; height: 4px; background: linear-gradient(var(--acc) 0 2px, var(--gold) 2px 4px); }
  .top .pdf { margin-left: auto; }
  @media (min-width: 900px) { .top .pdf { margin-left: 0; } }

  /* ── 카트리지 ──
     --w = 카트리지 폭. 껍데기 비율 1.3 : 1(가로가 긴 카트리지), 위 홈 · 아래 양옆 홈 · 종이 라벨(제목 띠 + 그림 + 아래 줄) */
  .cart { --w: 220px; --shell: var(--acc); --band: var(--ink); position: relative; display: block; flex: none; width: var(--w); aspect-ratio: 1.3; box-sizing: border-box;
          padding: calc(var(--w) * .12) calc(var(--w) * .055) calc(var(--w) * .055); border-radius: calc(var(--w) * .06) calc(var(--w) * .06) calc(var(--w) * .04) calc(var(--w) * .04);
          background: var(--shell); color: var(--ink); text-align: left; user-select: none;
          box-shadow: inset 0 2px 0 rgb(255 255 255 / .24), inset 0 -4px 0 rgb(0 0 0 / .22), inset 3px 0 0 rgb(255 255 255 / .06), inset -3px 0 0 rgb(0 0 0 / .12),
                      0 10px 16px -10px rgb(50 30 12 / .55); }
  .cart .grip { position: absolute; left: 17%; right: 17%; top: calc(var(--w) * .028); height: calc(var(--w) * .062); border-radius: 2px;
                background: repeating-linear-gradient(to bottom, rgb(0 0 0 / .3) 0 1px, rgb(255 255 255 / .18) 1px 2px, transparent 2px 4px); }
  .cart::before, .cart::after { content: ''; position: absolute; bottom: 15%; width: calc(var(--w) * .024); height: 17%; background: rgb(0 0 0 / .26); }
  .cart::before { left: 0; border-radius: 0 3px 3px 0; }
  .cart::after { right: 0; border-radius: 3px 0 0 3px; }
  .cart .lab { display: flex; flex-direction: column; height: 100%; overflow: hidden; border-radius: calc(var(--w) * .022); background: var(--paper);
               box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .cart .lt { position: relative; z-index: 1; display: flex; align-items: center; gap: calc(var(--w) * .03); padding: calc(var(--w) * .022) calc(var(--w) * .04);
              background: var(--band); color: var(--cream); box-shadow: 0 calc(var(--w) * .012) 0 var(--gold); }
  .cart .no { flex: none; font-family: var(--disp); font-stretch: 125%; font-weight: 800; font-size: max(7px, calc(var(--w) * .036)); letter-spacing: .08em; opacity: .78; white-space: nowrap; }
  .cart .ti { flex: 1; min-width: 0; font-family: var(--disp); font-stretch: 112%; font-weight: 900; font-size: max(10px, calc(var(--w) * .07)); line-height: 1.2;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart .art { position: relative; flex: 1; min-height: 0; margin-top: calc(var(--w) * .012); background: #171512; }
  .cart .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; }
  .cart .lf { display: flex; justify-content: space-between; gap: 8px; padding: calc(var(--w) * .016) calc(var(--w) * .04); font-size: max(8px, calc(var(--w) * .043)); font-weight: 700;
              line-height: 1.35; color: var(--muted); white-space: nowrap; }
  .cart .lf span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cart.sm .lf { display: none; }
  .flyer { z-index: 90; pointer-events: none; filter: drop-shadow(0 22px 18px rgb(40 22 10 / .35)); }

  /* ── 01 PLAYER: 커다란 카트리지 = 자기소개 ── */
  .bigcart { position: relative; padding: 52px 22px 22px; border-radius: 28px 28px 18px 18px; background: var(--acc);
             box-shadow: inset 0 3px 0 rgb(255 255 255 / .2), inset 0 -6px 0 rgb(0 0 0 / .22), inset 4px 0 0 rgb(255 255 255 / .06), inset -4px 0 0 rgb(0 0 0 / .14),
                         0 34px 50px -36px rgb(60 30 14 / .7); transition: transform .4s var(--ease); }
  @media (min-width: 768px) { .bigcart { padding: 58px 30px 30px; } }
  .bigcart .grip { position: absolute; left: 20%; right: 20%; top: 14px; height: 26px; border-radius: 3px;
                   background: repeating-linear-gradient(to bottom, rgb(0 0 0 / .32) 0 2px, rgb(255 255 255 / .16) 2px 3px, transparent 3px 7px); }
  .bigcart::before, .bigcart::after { content: ''; position: absolute; bottom: 18%; width: 9px; height: 74px; background: rgb(0 0 0 / .26); }
  .bigcart::before { left: 0; border-radius: 0 5px 5px 0; }
  .bigcart::after { right: 0; border-radius: 5px 0 0 5px; }
  .blabel { overflow: hidden; border-radius: 12px; background: var(--paper); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .bl-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 18px; padding: 10px 22px; background: var(--ink); color: var(--cream);
            font-family: var(--disp); font-stretch: 125%; font-weight: 800; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; box-shadow: 0 4px 0 var(--gold); }
  .bl-top .gold { color: var(--gold); }
  .bl-main { display: grid; gap: 28px; padding: 30px 22px 28px; }
  @media (min-width: 960px) { .bl-main { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 48px; padding: 42px 44px 40px; } }
  .pname { margin: 18px 0 0; font-size: clamp(52px, 8vw, 96px); font-weight: 900; line-height: 1; letter-spacing: -.05em; }
  .pname-en { margin: 12px 0 0; font-family: var(--disp); font-stretch: 125%; font-weight: 800; font-size: clamp(14px, 1.6vw, 18px); letter-spacing: .22em; text-transform: uppercase; color: var(--acc); }
  .pjob { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 6px 12px 6px 8px; border-radius: 7px; background: var(--ink); color: var(--cream); font-size: 14px; font-weight: 700; }
  .pjob i { width: 8px; height: 8px; border-radius: 50%; background: #FF4A3D; box-shadow: 0 0 6px 1px rgb(255 74 61 / .55); }
  .phead { margin: 22px 0 0; font-size: clamp(20px, 2.2vw, 25px); font-weight: 800; line-height: 1.5; letter-spacing: -.02em; text-wrap: balance; }
  .phead span { background: linear-gradient(transparent 60%, rgb(185 138 46 / .3) 60%); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .intro-box { position: relative; padding: 22px 22px 20px; border-radius: 10px; border: 1px dashed var(--line2); background: color-mix(in srgb, var(--bg) 45%, var(--paper)); }
  .intro-box .lbl { position: absolute; top: -11px; left: 16px; padding: 2px 10px; border-radius: 5px; background: var(--acc); color: var(--cream); font-size: 12px; font-weight: 800; }
  .intro-box p { margin: 0; font-size: 16px; line-height: 1.8; color: var(--body); }
  .intro-box p + p { margin-top: 10px; }
  .pbtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  /* ── 02 SOFTWARE: TV · 본체 · 정보 · 선반 ── */
  .lib { display: grid; gap: 36px; }
  @media (min-width: 1100px) { .lib { grid-template-columns: minmax(0, 1.28fr) minmax(0, 1fr); gap: 40px; align-items: start; } }
  .setup { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

  .tv { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 58px; gap: 14px; padding: 16px; border-radius: 26px;
        background: linear-gradient(#36322E, #24211E); box-shadow: inset 0 2px 0 rgb(255 255 255 / .1), inset 0 -3px 0 rgb(0 0 0 / .3), 0 26px 40px -28px rgb(30 18 8 / .7); }
  @media (max-width: 559px) { .tv { grid-template-columns: minmax(0, 1fr); padding: 12px; border-radius: 20px; } .tvside { display: none !important; } }
  .scr { position: relative; overflow: hidden; border-radius: 22px / 18px; background: radial-gradient(120% 90% at 30% 20%, #1D1B19, var(--screen) 60%);
         box-shadow: 0 0 0 3px #161411, 0 0 0 5px #3A3632; transition: aspect-ratio .3s; }
  .scr .cont { position: absolute; inset: 0; }
  .scr .cont > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cont.boot { animation: crtOn .62s var(--ease) both; }
  .cont.shut { animation: crtOff .36s ease-in both; }
  .idle { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; padding: 16px; text-align: center; color: #E9DFCC;
          font-family: var(--pix); background: radial-gradient(90% 80% at 50% 40%, #191714, #0C0B0A); }
  .idle .bars { width: 64px; height: 12px; background: linear-gradient(var(--acc) 0 6px, transparent 6px 8px, var(--gold) 8px 12px); }
  .idle .p1 { margin: 6px 0 0; font-size: 12px; letter-spacing: .1em; color: var(--gold); }
  .idle .nm { margin: 0; font-size: clamp(20px, 3vw, 30px); font-weight: 700; }
  .idle .msg { margin: 8px 0 0; font-size: 13px; color: #BDB4A4; }
  .idle .go { margin: 0; font-size: 12px; color: #FF6A5C; }
  .tvside { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0; }
  .knob { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0;
          background: radial-gradient(circle at 35% 30%, #625B53, #2C2824 72%); box-shadow: 0 3px 0 #141210, inset 0 0 0 2px #1B1916; transition: transform .1s; }
  .knob i { position: absolute; inset: 0; transition: transform .45s var(--spring); }
  .knob i::after { content: ''; position: absolute; left: 50%; top: 6px; width: 4px; height: 12px; margin-left: -2px; border-radius: 2px; background: #E9DFCC; }
  .knob:hover { box-shadow: 0 3px 0 #141210, inset 0 0 0 2px var(--gold); }
  .knob:active { transform: translateY(2px); box-shadow: 0 1px 0 #141210, inset 0 0 0 2px var(--gold); }
  .chl { font-family: var(--disp); font-stretch: 125%; font-weight: 800; font-size: 10px; letter-spacing: .08em; color: #CFC4B0; white-space: nowrap; }
  .grille { flex: 1; width: 34px; min-height: 40px; border-radius: 4px; background: repeating-linear-gradient(to bottom, #151310 0 3px, transparent 3px 6px); }
  .pled { width: 8px; height: 8px; border-radius: 50%; background: #3A2020; }
  .pled.on { background: #FF4A3D; box-shadow: 0 0 8px 2px rgb(255 74 61 / .55); }

  .console { --w: 236px; position: relative; width: min(100%, 520px); margin: 0 auto; padding-top: calc(var(--w) / 1.3 * .56); }
  @media (max-width: 559px) { .console { --w: 176px; } }
  .holder { position: absolute; left: 50%; top: 0; z-index: 1; width: var(--w); aspect-ratio: 1.3; margin-left: calc(var(--w) / -2); }
  .holder .cart { --w: inherit; width: 100%; }
  .holder .cart.seat { animation: seat .4s cubic-bezier(.3, .8, .3, 1) both; }
  .drop-hint { position: absolute; left: 50%; top: 4px; z-index: 3; padding: 6px 12px; border-radius: 7px; background: var(--ink); color: var(--cream); font-size: 12.5px; font-weight: 800;
               white-space: nowrap; transform: translate(-50%, 6px); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
  .console.hot .drop-hint { opacity: 1; transform: translate(-50%, 0); animation: bob .6s ease-in-out infinite; }
  .cbody { position: relative; z-index: 2; border-radius: 18px 18px 14px 14px; background: linear-gradient(#F5EFE3, #E7DDC9 72%, #DCD0B8);
           box-shadow: inset 0 2px 0 #fff, 0 2px 0 #CBBE9F, 0 22px 26px -18px rgb(60 36 16 / .55); }
  .cbody.clunk { animation: clunk .3s ease-out .26s; }
  .ctop { position: relative; height: 48px; }
  .slot { position: absolute; left: 50%; top: -2px; width: calc(var(--w) + 22px); height: 16px; margin-left: calc((var(--w) + 22px) / -2); border-radius: 0 0 8px 8px;
          background: linear-gradient(#0D0B0A, #2C2824); box-shadow: inset 0 -2px 0 rgb(255 255 255 / .12); transition: box-shadow .15s; }

  .vent { position: absolute; top: 18px; width: 18%; height: 14px; background: repeating-linear-gradient(to bottom, rgb(0 0 0 / .14) 0 1px, rgb(255 255 255 / .7) 1px 2px, transparent 2px 4px); }

<body>
<div id="root"><p style="padding:96px 24px;color:#6B6256;font-family:system-ui,sans-serif">불러오는 중…</p></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;
const { flushSync } = ReactDOM;

// 카트리지 껍데기 색(프로젝트 순서대로 돌려 씀). temp3/deck.html의 SHELLS와 같은 순서·같은 색
const SHELLS = [
  { shell: '#8E1F2E', band: '#23201C' },   // 마룬
  { shell: '#2E2B28', band: '#8E1F2E' },   // 먹색
  { shell: '#B98A2E', band: '#23201C' },   // 금색
  { shell: '#CFC2A4', band: '#8E1F2E' },   // 짙은 크림
];
const shellOf = (i) => SHELLS[((i % SHELLS.length) + SHELLS.length) % SHELLS.length];

// ── 문구 표(theme/strings.tsv): 맨 끝 "내 문구" 칸 → 없으면 기본 문구 ──
const FALLBACK = {
  'name.portfolio': '포트폴리오', 'name.deck': '발표 덱', 'name.doc': '상세 기술문서', 'name.doc-short': '상세 문서', 'name.video': '시연 영상',
  'name.role': '내 역할', 'name.intent': '개발 의도', 'name.team': '팀 프로젝트', 'name.solo': '개인 프로젝트',
  'page.updated': '업데이트 {date}', 'page.intro': '자기소개', 'page.stack': '기술 스택', 'page.stack-note': '근거 프로젝트와 함께',
  'page.features': '기능 소개', 'page.see-in-deck': '{name.deck}에서 보기', 'page.deck-all': '{name.deck} 전체',
  'page.nav-contact': '연락처', 'page.print-email': '이메일', 'ui.preparing': '준비 중…',
  'en.portfolio': 'PORTFOLIO', 'en.skills': 'SKILLS', 'en.project': 'PROJECT', 'en.contact': 'CONTACT',
};
async function loadStrings() {
  const table = { ...FALLBACK };
  try {
    const r = await fetch('../theme/strings.tsv', { cache: 'no-cache' });
    if (r.ok) {
      const txt = (await r.text()).replace(/^﻿/, '');
      for (const line of txt.split(/\r?\n/)) {
        if (!line || line.startsWith('#')) continue;
        const c = line.split('\t');
        if (c.length < 3 || c[0] === '키') continue;
        const mine = (c[3] || '').trim();
        table[c[0].trim()] = mine || c[2].trim();
      }
    }
  } catch (e) { /* 표가 없으면 기본 문구 */ }
  const resolve = (k, depth = 0) => String(table[k] ?? '').replace(/\{([a-z0-9-]+\.[a-z0-9-]+)\}/g, (m, ref) => depth > 4 ? m : resolve(ref, depth + 1));
  return (k, vars = {}) => resolve(k).replace(/\{([a-z0-9-]+)\}/g, (m, v) => (v in vars ? vars[v] : m));
}

function Rich({ text }) {
  if (!text) return null;
  return String(text).split(/(`[^`]+`)/g).map((p, i) => p.startsWith('`') && p.endsWith('`') && p.length > 1
    ? <code key={i} className="ic">{p.slice(1, -1)}</code> : <React.Fragment key={i}>{p}</React.Fragment>);
}
const pad = (n) => String(n).padStart(2, '0');
const isUrl = (u) => /^https?:\/\//.test(u || '');
const img = (p, src) => `../src/${p.id}/${src}`;
// 발표 덱은 temp3 전용 카트리지 덱(deck.html — 원본 렌더러 + temp3/deck-theme.css 색 + temp3/deck-layout.css 배치). 원본 덱은 ../project.html
const deckUrl = (p, sid = '') => `deck.html?p=${encodeURIComponent(p.id)}${sid ? `#s=${sid}` : ''}`;
const docUrl = (p) => `../doc.html?p=${encodeURIComponent(p.id)}`;
const shortUrl = (u) => String(u || '').replace(/^https?:\/\//, '').replace(/\/$/, '');
const teamLabel = (team, t) => (team?.type === 'team' ? `${t('name.team')}${team.size ? ' · ' + team.size : ''}` : t('name.solo'));
const metaOf = (p, re) => ((p.meta || []).find((m) => re.test(m.label || '')) || {}).value || '';
// 기간 값에서 시작 연도만 꺼냄(값의 일부 그대로 — 새 날짜를 만들지 않음)
const yearOf = (v) => (String(v).match(/(\d{4})\./) || [])[1] || '';
// 기능 절(section) → 발표 덱 장면 id (원본 포트폴리오 문서와 같은 규칙)
const norm = (s) => String(s || '').replace(/[`*_~]/g, '').replace(/\s+/g, ' ').trim();
const keyOk = (k) => /^[a-z][a-z0-9-]{1,31}$/.test(k || '') && !/^s-\d+$/.test(k);
function deckScene(p, section) {
  const want = norm(section);
  if (!want || !p.deck?.slides?.length) return '';
  const last = (x) => norm((x.sectionPath || []).slice(-1)[0]);
  const find = (list) => list.find((x) => last(x) === want) || list.find((x) => (x.sectionPath || []).some((s) => norm(s) === want));
  const sl = find(p.deck.slides);
  if (sl) return keyOk(sl.key) ? `d-${sl.key}` : '';
  const hid = find(p.deck.base || []);
  return hid && keyOk(hid.chapter) && p.deck.slides.some((x) => x.chapter === hid.chapter) ? `ch-${hid.chapter}` : '';
}
const reduceMotion = () => !!window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const inView = (r) => r && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
const scrollToId = (id) => document.getElementById(id)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });

// [포트폴리오 PDF] — 원본 포트폴리오 문서(../index.html)는 A4 인쇄용(제출 PDF). 보이지 않는 틀에 불러 다 그려진 뒤 그 틀의 인쇄 창을 띄움
const waitMax = (p, ms) => Promise.race([p, wait(ms)]);
let printFrame = null;
async function printOriginal() {
  if (!printFrame) {
    const f = document.createElement('iframe');
    f.title = '인쇄용 포트폴리오 문서';
    f.tabIndex = -1;
    f.setAttribute('aria-hidden', 'true');
    Object.assign(f.style, { position: 'fixed', left: '-12000px', top: '0', width: '1200px', height: '900px', border: '0' });
    const loaded = new Promise((res, rej) => { f.onload = res; f.onerror = rej; });
    f.src = '../index.html';
    document.body.appendChild(f);
    await waitMax(loaded, 20000);
    printFrame = f;
  }
  const w = printFrame.contentWindow;
  if (!w || !w.PFPage) { printFrame.remove(); printFrame = null; throw new Error('원본 포트폴리오 문서를 불러오지 못했습니다'); }
  await waitMax(w.PFPage.whenReady(), 15000);
  const imgs = [...w.document.images];
  imgs.forEach((i) => { i.loading = 'eager'; });
  await waitMax(Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => {
    i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); })))), 15000);
  try { await waitMax(w.document.fonts.ready, 5000); } catch (e) { /* 글꼴 대기 실패는 무시 */ }
  w.focus();
  w.print();
}
function usePrint() {
  const [busy, setBusy] = useState(false);
  const run = async () => {
    if (busy) return;
    setBusy(true);
    try { await printOriginal(); }
    catch (e) { console.warn('[temp3] 인쇄 창을 띄우지 못해 원본 포트폴리오 문서를 새 탭으로 엽니다:', e); window.open('../index.html', '_blank', 'noopener'); }
    finally { setBusy(false); }
  };
  return [busy, run];
}
function PdfButton({ t, className = '' }) {
  const [busy, run] = usePrint();
  return (
    <button type="button" className={`btn sm ${className}`} onClick={run} disabled={busy} aria-busy={busy} title="제출용 포트폴리오 문서(A4)를 PDF로 저장">

}

}

// ── 01 PLAYER: 커다란 카트리지 한 개 = 자기소개 ──
function Hero({ pf, prof, projects, t }) {
  const year = (pf.generatedAt || '').slice(0, 4);
  return (
    <section id="intro" className="sec">
      <div className="wrap">
        <article className="bigcart" aria-label={`${prof.name} 자기소개`}>

// ── 본체·TV 상태와 동작: 꽂기(선반 → 날아가 꽂힘 → TV 켜짐) · 꺼내기(튀어나와 선반으로) · 전원 · 리셋 ──
function useConsole(projects) {
  const n = projects.length;
  const [cur, setCur] = useState(null);        // 꽂힌 소프트(번호) — 없으면 null
  const [last, setLast] = useState(0);         // 설명서가 보여 줄 소프트(마지막으로 꽂은 것)
  const [power, setPower] = useState(true);
  const [shut, setShut] = useState(false);     // TV가 꺼지는 중(가로줄로 접힘)
  const [boot, setBoot] = useState(0);         // +1 = TV 켜짐 연출 다시
  const [seat, setSeat] = useState(0);         // +1 = 카트리지가 슬롯에 내려앉는 연출 다시
  const [flying, setFlying] = useState(null);  // 날아가는 중인 소프트(선반 자리는 비워 둠)
  const [hot, setHot] = useState(false);       // 끌고 온 카트리지가 본체 위에 있음
  const curRef = useRef(null); curRef.current = cur;
  const powerRef = useRef(true); powerRef.current = power;
  const busy = useRef(false);
  const touched = useRef(false);
  const holderRef = useRef(null), consoleRef = useRef(null), rackRefs = useRef([]);

  const makeFlyer = (el, r, sm) => {
    const c = el.cloneNode(true);
    c.classList.remove('seat');
    c.classList.toggle('sm', !!sm);
    c.classList.add('flyer');
    c.setAttribute('aria-hidden', 'true');
    Object.assign(c.style, { position: 'fixed', left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, margin: '0', transformOrigin: '0 0', transform: 'none', animation: 'none', transition: 'none' });
    c.style.setProperty('--w', `${r.width}px`);
    document.body.appendChild(c);
    return c;
  };
  const flyTo = async (c, from, to, arc) => {
    const s = to.width / from.width;
    const dx = to.left - from.left, dy = to.top - from.top;
    const a = c.animate([
      { transform: 'translate(0, 0) scale(1) rotate(0deg)' },
      { transform: `translate(${dx * .5}px, ${dy * .5 + arc}px) scale(${(1 + s) / 2}) rotate(${dx < 0 ? -7 : 7}deg)`, offset: .5 },
      { transform: `translate(${dx}px, ${dy}px) scale(${s}) rotate(0deg)` },
    ], { duration: 540, easing: 'cubic-bezier(.45, .05, .25, 1)', fill: 'forwards' });
    try { await a.finished; } catch (e) { /* 취소 */ }
  };
  // 꺼내기: 슬롯에서 톡 튀어나와 선반 제자리로 날아감 → TV는 "카트리지 없음" 화면
  const doEject = async () => {
    const i = curRef.current;
    if (i == null) return;
    const rm = reduceMotion();
    setShut(true);
    const hc = holderRef.current?.querySelector('.cart');
    if (!rm && hc) {
      const pop = hc.animate([{ transform: 'none' }, { transform: 'translateY(-48%)' }], { duration: 230, easing: 'cubic-bezier(.2, 1.4, .4, 1)', fill: 'forwards' });
      try { await pop.finished; } catch (e) { /* 취소 */ }
      const from = hc.getBoundingClientRect();
      const c = makeFlyer(hc, from, true);
      flushSync(() => { setCur(null); setFlying(i); });
      const spot = rackRefs.current[i]?.querySelector('.cart');
      const to = spot?.getBoundingClientRect();
      if (to && inView(to)) await flyTo(c, from, to, -50);
      flushSync(() => setFlying(null));
      c.remove();
    } else {
      flushSync(() => setCur(null));
      if (!rm) await wait(200);
    }
    setShut(false);
    setBoot((x) => x + 1);
  };
  // 꽂기: from = 끌어 놓은 자리(없으면 선반의 그 카트리지 자리)
  const insert = async (i, from) => {
    touched.current = true;
    if (busy.current || i == null || i < 0 || i >= n) return;
    if (i === curRef.current) { reset(); return; }
    busy.current = true;
    try {
      if (curRef.current != null) await doEject();
      const src = rackRefs.current[i]?.querySelector('.cart');
      const r = from || src?.getBoundingClientRect();
      let c = null;
      if (!reduceMotion() && src && r && inView(r) && holderRef.current) {
        c = makeFlyer(src, r, true);
        flushSync(() => setFlying(i));
        const h = holderRef.current.getBoundingClientRect();
        await flyTo(c, r, { left: h.left, top: h.top - h.height * .46, width: h.width }, -80);
      }
      flushSync(() => { setCur(i); setLast(i); setFlying(null); setPower(true); setShut(false); setSeat((x) => x + 1); setBoot((x) => x + 1); });
      c?.remove();
    } finally { busy.current = false; }
  };
  const eject = async () => {
    touched.current = true;
    if (busy.current || curRef.current == null) return;
    busy.current = true;
    try { await doEject(); } finally { busy.current = false; }
  };
  const reset = () => { touched.current = true; setPower(true); setShut(false); setBoot((x) => x + 1); };
  const togglePower = async () => {
    touched.current = true;
    if (busy.current) return;
    if (powerRef.current) {
      busy.current = true;
      setShut(true);
      await wait(reduceMotion() ? 0 : 360);
      flushSync(() => { setPower(false); setShut(false); });
      busy.current = false;
    } else { setPower(true); setBoot((x) => x + 1); }
  };
  const step = (d) => insert(((curRef.current ?? (d > 0 ? -1 : 0)) + d + n) % n);
  return { n, cur, last, power, shut, boot, seat, flying, hot, setHot, insert, eject, reset, togglePower, step, touched, holderRef, consoleRef, rackRefs };
}

// 선반의 카트리지 한 개: 누르면 꽂힘. 마우스로 끌어다 본체 위에 놓아도 꽂힘(터치는 누르기만 — 화면 밀기와 겹치지 않게)
function RackItem({ p, i, c }) {
  const state = c.cur === i ? 'in' : c.flying === i ? 'fly' : 'idle';
  const btn = useRef(null);
  const drag = useRef(null);
  const skip = useRef(false);
  const [dragging, setDragging] = useState(false);
  const cartEl = () => btn.current?.querySelector('.cart');
  const down = (e) => {
    skip.current = false;
    if (e.button !== 0 || e.pointerType === 'touch' || state !== 'idle') return;
    drag.current = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, over: false, dx: 0, dy: 0 };
  };
  const move = (e) => {
    const d = drag.current;
    if (!d || d.id !== e.pointerId) return;
    d.dx = e.clientX - d.x; d.dy = e.clientY - d.y;
    if (!d.moved) {
      if (Math.hypot(d.dx, d.dy) < 6) return;
      d.moved = true;
      try { btn.current.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
      setDragging(true);
    }
    const el = cartEl();
    if (el) el.style.transform = `translate(${d.dx}px, ${d.dy}px) rotate(${Math.max(-9, Math.min(9, d.dx / 26))}deg) scale(1.05)`;
    const r = c.consoleRef.current?.getBoundingClientRect();
    const over = !!r && e.clientX > r.left - 24 && e.clientX < r.right + 24 && e.clientY > r.top - 70 && e.clientY < r.bottom + 24;
    if (over !== d.over) { d.over = over; c.setHot(over); }
  };
  const up = () => {
    const d = drag.current;
    drag.current = null;
    if (!d || !d.moved) return;
    skip.current = true;
    setDragging(false);
    c.setHot(false);
    const el = cartEl();
    if (!el) return;
    const was = el.style.transform;
    el.style.transform = '';
    if (d.over) {
      const r = el.getBoundingClientRect();
      c.insert(i, { left: r.left + d.dx, top: r.top + d.dy, width: r.width });
    } else if (!reduceMotion()) {
      el.animate([{ transform: was }, { transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.34, 1.56, .64, 1)' });
    }
  };
  const click = () => { if (skip.current) { skip.current = false; return; } c.insert(i); };
  return (
    <li ref={(el) => { c.rackRefs.current[i] = el; }} className={`ritem ${dragging ? 'drag' : ''}`}>
      {state === 'in' ? (
        <>
          <div className="ghost"><span>IN SLOT</span><button type="button" className="btn sm" onClick={c.eject}>⏏ 꺼내기</button></div>
          <span className="rcap in">{p.title} · 꽂힘</span>
        </>
      ) : (
        <>
          <button ref={btn} type="button" className="rbtn" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onClick={click}
                  aria-label={`${p.title} 카트리지 꽂기`} title="누르거나 끌어다 본체에 꽂기">
            <Cart p={p} i={i} sm style={state === 'fly' ? { visibility: 'hidden' } : undefined} />
          </button>
          <span className="rcap">{p.title}</span>
        </>
      )}
    </li>
  );
}

// ── 02 SOFTWARE ──
function Library({ projects, prof, t, c }) {
  const p = c.cur != null ? projects[c.cur] : null;
  const ref = useRef(null);
  // 처음 화면에 들어오면 첫 소프트가 저절로 꽂힘(손대기 전까지만 — 꽂는 방법을 보여 줌). 주소 #soft-<폴더 이름>이면 그 소프트
  useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) return;
    const want = (/^#soft-(.+)$/.exec(decodeURIComponent(location.hash)) || [])[1];
    const k = Math.max(0, projects.findIndex((x) => x.id === want));
    let tm = 0;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      tm = setTimeout(() => { if (!c.touched.current) c.insert(k); }, 650);
    }, { threshold: .45 });
    io.observe(el);
    return () => { io.disconnect(); clearTimeout(tm); };
  }, []);
  return (
    <section id="library" className="sec" ref={ref}>
      <div className="wrap">
        <Head no="02" en="SOFTWARE" title="소프트 라이브러리">
          <span>카트리지를 <b>누르거나 끌어다</b> 본체에 꽂으세요</span>
          <span className="hidden md:inline"><kbd>◀</kbd><kbd>▶</kbd> 바꿔 꽂기</span>
        </Head>
        <div className="lib">
          <div className="setup">
            <TV p={p} i={c.cur} power={c.power} shut={c.shut} boot={c.boot} prof={prof} onCh={() => c.step(1)} />
            <Console c={c} projects={projects} />
          </div>
          <div className="side">
            <NowPlaying p={p} i={c.cur} n={projects.length} t={t} />
            <div>
              <div className="rack-h"><span className="eyebrow">SOFT RACK · {pad(projects.length)}</span><span className="muted">누르거나 끌어서 꽂기</span></div>
              <ul className="rack" aria-label="소프트 선반">
                {projects.map((x, i) => <RackItem key={x.id} p={x} i={i} c={c} />)}
              </ul>
              <div className="shelf" aria-hidden="true" />
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function PageBody({ pg, ctx }) {
  const { p, i, t, list, jump, zoom } = ctx;
  switch (pg.kind) {
    case 'intro': return <PIntro p={p} i={i} t={t} />;
    case 'toc': return <PToc p={p} list={list} jump={jump} t={t} />;
    case 'feat': return <PFeat p={p} pg={pg} t={t} zoom={zoom} />;
    case 'trouble': return <PTrouble pg={pg} />;

    case 'shots': return <PShots p={p} t={t} zoom={zoom} />;
    default: return <><p className="ptab q"><b>✎</b>MEMO</p><div className="memo" aria-hidden="true" /></>;
  }
}
function Page({ idx, side, on, extra = '', ctx }) {
  const pg = ctx.list[idx];
  if (!pg) return null;
  return (
    <div className={`page ${side} ${on ? 'on' : ''} ${extra}`} aria-hidden={on ? undefined : 'true'} role="group" aria-label={on ? `${idx + 1}쪽 — ${GROUPS[pg.g]}` : undefined}>
      <div className="rh" aria-hidden="true"><span>{ctx.p.title} <i>취급 설명서</i></span><span>{GROUPS[pg.g]}</span></div>
      <div className="pbody"><PageBody pg={pg} ctx={ctx} /></div>
      <div className="pn" aria-hidden="true">— {idx + 1} —</div>
    </div>
  );
}
function useWidth(ref) {
  const [w, setW] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const on = () => setW(el.clientWidth);
    on();
    const ro = new ResizeObserver(on);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return w;
}

function Manual({ projects, t, c, keys, zoom }) {
  const i = c.last;
  const p = projects[i];
  const wrapRef = useRef(null);
  const width = useWidth(wrapRef);
  const wide = width >= 860;
  const per = wide ? 2 : 1;
  const base = useMemo(() => buildPages(p), [p]);
  const list = useMemo(() => (wide && base.length % 2 ? [...base, { key: 'memo', kind: 'memo', g: 'memo' }] : base), [base, wide]);
  const total = Math.ceil(list.length / per);
  const [s, setS] = useState(0);
  const [flip, setFlip] = useState(null);     // { from, to } — 넓은 화면의 책장 넘김
  const [dir, setDir] = useState(0);          // 좁은 화면의 미끄러짐 방향
  const sRef = useRef(0); sRef.current = s;
  const flipRef = useRef(null); flipRef.current = flip;
  useEffect(() => { setS(0); setFlip(null); }, [p.id, per]);
  const done = useRef(0);
  const finish = () => { const f = flipRef.current; if (!f) return; clearTimeout(done.current); setS(f.to); setFlip(null); };
  const go = (to) => {
    if (flipRef.current) return;
    const from = sRef.current;
    to = Math.max(0, Math.min(total - 1, to));
    if (to === from) return;
    if (!wide || reduceMotion()) { setDir(to > from ? 1 : -1); setS(to); return; }
    setFlip({ from, to });
    done.current = setTimeout(finish, 1000);   // 애니메이션 끝 알림이 오지 않아도 넘어가게
  };
  const jump = (idx) => go(Math.floor(idx / per));
  keys.current.manual = (d) => go(sRef.current + d);
  const ctx = { p, i, t, list, jump, zoom };
  // 어느 쪽이 보이나
  const L = (sp) => sp * 2, R = (sp) => sp * 2 + 1;
  let showL, showR, leaf = null;
  if (wide) {
    if (flip) {
      const fwd = flip.to > flip.from;
      showL = fwd ? L(flip.from) : L(flip.to);
      showR = fwd ? R(flip.to) : R(flip.from);
      leaf = fwd ? { cls: 'n', front: [R(flip.from), 'r'], back: [L(flip.to), 'l'] } : { cls: 'p', front: [L(flip.from), 'l'], back: [R(flip.to), 'r'] };
    } else { showL = L(s); showR = R(s); }
  }
  const curIdx = wide ? L(flip ? flip.to : s) : s;
  const curGroup = list[curIdx]?.g;
  const firstOf = (g) => list.findIndex((x) => x.g === g);
  // 휴대폰: 옆으로 밀어 넘기기
  const sw = useRef(null);
  const onDown = (e) => { if (e.pointerType === 'touch') sw.current = { x: e.clientX, y: e.clientY }; };
  const onUp = (e) => {
    const a = sw.current; sw.current = null;
    if (!a) return;
    const dx = e.clientX - a.x, dy = e.clientY - a.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(sRef.current + (dx < 0 ? 1 : -1));
  };
  const pagesLabel = wide ? `${L(s) + 1}–${Math.min(R(s) + 1, list.length)}` : `${s + 1}`;
  return (
    <section id="manual" className="sec">
      <div className="wrap">
        <Head no="03" en="INSTRUCTION MANUAL" title={<>{p.title} <span style={{ color: 'var(--acc)' }}>취급 설명서</span></>}>
          <span>위에서 꽂은 소프트의 설명서입니다</span>
          <span className="hidden md:inline"><kbd>◀</kbd><kbd>▶</kbd> 넘기기 · 모서리·옆 색인도 됨</span>
        </Head>
        <div className="mtop" role="group" aria-label="설명서 고르기">
          <span className="lb">소프트</span>
          {projects.map((x, k) => (
            <button key={x.id} type="button" className="pchip" style={{ '--shell': shellOf(k).shell }} aria-pressed={k === i} onClick={() => c.insert(k)}><i aria-hidden="true" />{x.title}</button>
          ))}
        </div>
        <div className="bookwrap" ref={wrapRef}>
          <div className={`book ${wide ? 'wide' : ''}`} style={{ '--shell': shellOf(i).shell }} onPointerDown={onDown} onPointerUp={onUp}>
            <div className="spread" key={`${p.id}-${per}`}>
              {wide ? (
                <>
                  <div className="pslot">{list.map((_, j) => j % 2 === 0 ? <Page key={j} idx={j} side="l" on={j === showL} ctx={ctx} /> : null)}</div>
                  <div className="pslot">{list.map((_, j) => j % 2 === 1 ? <Page key={j} idx={j} side="r" on={j === showR} ctx={ctx} /> : null)}</div>
                  {leaf && (
                    <div className={`leaf ${leaf.cls}`} onAnimationEnd={(e) => { if (e.target === e.currentTarget) finish(); }} aria-hidden="true">
                      <div className="face"><Page idx={leaf.front[0]} side={leaf.front[1]} on ctx={ctx} /></div>
                      <div className="face back"><Page idx={leaf.back[0]} side={leaf.back[1]} on ctx={ctx} /></div>
                    </div>
                  )}
                  <button type="button" className="curl l" onClick={() => go(s - 1)} disabled={s === 0} aria-label="이전 쪽" />
                  <button type="button" className="curl r" onClick={() => go(s + 1)} disabled={s >= total - 1} aria-label="다음 쪽" />
                </>
              ) : (
                <div className="pslot">{list.map((_, j) => <Page key={j} idx={j} side="" on={j === s} extra={j === s && dir ? (dir > 0 ? 'in-n' : 'in-p') : ''} ctx={ctx} />)}</div>
              )}
            </div>
          </div>
          <nav className="itabs" aria-label="설명서 색인">
            {TABS.filter(([g]) => firstOf(g) >= 0).map(([g, l]) => (
              <button key={g} type="button" className={`itab ${curGroup === g ? 'on' : ''}`} onClick={() => jump(firstOf(g))}>{l}</button>
            ))}
          </nav>
        </div>
        <div className="mnav">
          <button type="button" className="btn sm" onClick={() => go(s - 1)} disabled={s === 0} aria-label="이전 쪽">◀ 이전</button>
          <span className="ct" aria-live="polite">{pagesLabel} / {list.length}</span>
          <button type="button" className="btn sm pri" onClick={() => go(s + 1)} disabled={s >= total - 1} aria-label="다음 쪽">다음 ▶</button>
          {!wide && (
            <div className="flex flex-wrap justify-center gap-2 w-full">
              {TABS.filter(([g]) => firstOf(g) >= 0).map(([g, l]) => (
                <button key={g} type="button" className="pchip" style={{ '--shell': curGroup === g ? 'var(--acc)' : 'var(--line2)' }} aria-pressed={curGroup === g} onClick={() => jump(firstOf(g))}><i aria-hidden="true" />{l}</button>
              ))}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

// 크게 보기: 그림 비율 그대로(화면 안에 맞춤). ◀ ▶ 로 넘기고 Esc·바깥 누르기로 닫음
function Lightbox({ p, items, start, onClose }) {
  const [k, setK] = useState(start);
  const closeRef = useRef(null);
  const n = items.length;
  const move = (d) => setK((x) => (x + d + n) % n);
  useEffect(() => {
    const back = document.activeElement;
    document.body.classList.add('lb-open');
    closeRef.current?.focus();
    const on = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); onClose(); }
      else if (e.key === 'ArrowRight' && n > 1) { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowLeft' && n > 1) { e.preventDefault(); move(-1); }
    };
    window.addEventListener('keydown', on);
    return () => { window.removeEventListener('keydown', on); document.body.classList.remove('lb-open'); back?.focus?.({ preventScroll: true }); };
  }, []);
  const it = items[k];
  return ReactDOM.createPortal(
    <div className="lbx" role="dialog" aria-modal="true" aria-label={it.caption || p.title} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <figure>
        <img key={it.src} src={img(p, it.src)} alt={it.caption || ''} />
        <figcaption>{n > 1 && <b>SHOT {pad(k + 1)}/{pad(n)}</b>}<span>{it.caption}</span></figcaption>
      </figure>
      <button ref={closeRef} type="button" className="x btn sm" onClick={onClose}>✕ 닫기 <kbd>Esc</kbd></button>
      {n > 1 && <>
        <button type="button" className="nv l btn" onClick={() => move(-1)} aria-label="이전 그림">◀</button>
        <button type="button" className="nv r btn" onClick={() => move(1)} aria-label="다음 그림">▶</button>
      </>}
    </div>,
    document.body,
  );
}

// 지금 보고 있는 절
function useActive(ids) {
  const [active, setActive] = useState(ids[0]);
  const ref = useRef(active); ref.current = active;
  useEffect(() => {
    const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
    if (!('IntersectionObserver' in window) || !els.length) return;
    const io = new IntersectionObserver((ents) => ents.forEach((e) => e.isIntersecting && setActive(e.target.id)), { rootMargin: '-42% 0px -52% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, [ids.join('|')]);
  return [active, ref];
}

function Main({ pf, prof, projects, t }) {

  const [active, activeRef] = useActive(ids);
  const zoom = (p, items, start) => setLb({ p, items, start });
  // 다른 절에서 소프트를 고르면: 선반이 보이게 올라간 뒤 꽂음(날아가는 연출이 화면 안에서 보이게)
  const goSoft = async (k) => {
    c.touched.current = true;
    const el = document.getElementById('library');
    const r = el?.getBoundingClientRect();
    if (r && (r.top > 80 || r.bottom < innerHeight * .6)) { scrollToId('library'); await wait(reduceMotion() ? 0 : 700); }
    c.insert(k);
  };
  keys.current.library = (d) => c.step(d);
  // ◀ ▶ = 지금 보는 절 안에서(소프트 = 바꿔 꽂기, 설명서 = 쪽 넘기기)
  useEffect(() => {
    const on = (e) => {
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (document.body.classList.contains('lb-open')) return;
      const tg = e.target;
      if (tg && tg.closest && tg.closest('input, textarea, select, [contenteditable="true"]')) return;
      const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      const h = d && keys.current[activeRef.current];
      if (!h) return;
      e.preventDefault();
      h(d);
    };
    window.addEventListener('keydown', on);
    return () => window.removeEventListener('keydown', on);
  }, []);
  return (
    <>
      <Top prof={prof} t={t} active={active} />
      <main>
        <Hero pf={pf} prof={prof} projects={projects} t={t} />
        {projects.length > 0 && <Library projects={projects} prof={prof} t={t} c={c} />}
        {projects.length > 0 && <Manual projects={projects} t={t} c={c} keys={keys} zoom={zoom} />}
        <Spec pf={pf} prof={prof} projects={projects} t={t} goSoft={goSoft} />
        <Contact prof={prof} projects={projects} t={t} c={c} goSoft={goSoft} />
      </main>
      <footer className="wrap">
        <div className="foot"><span>© {prof.nameEn || prof.name}</span><span>{pf.generatedAt ? `UPDATED ${pf.generatedAt.replace(/-/g, '.')}` : ''}</span></div>
      </footer>
      {lb && <Lightbox p={lb.p} items={lb.items} start={lb.start} onClose={() => setLb(null)} />}
    </>
  );
}

function App() {
  const [state, setState] = useState({ ok: false });
  useEffect(() => {
    (async () => {
      try {
        const [t, pf] = await Promise.all([loadStrings(), fetch('../data/portfolio.json', { cache: 'no-cache' }).then((r) => r.json())]);
        const projects = (await Promise.all((pf.projects || []).map((id) =>
          fetch(`../data/projects/${encodeURIComponent(id)}.json`, { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).catch(() => null)))).filter(Boolean);
        const prof = pf.profile || {};
        document.title = `${prof.name ? prof.name + ' · ' : ''}${t('name.portfolio')}`;
        setState({ ok: true, t, pf, prof, projects });
      } catch (e) {
        setState({ ok: false, err: String(e) });
      }
    })();
  }, []);
  // 주소에 #절 이 있으면 그려진 뒤 그 절로(#soft-<폴더 이름>은 소프트 절)
  useEffect(() => {
    if (!state.ok || !location.hash) return;
    const h = decodeURIComponent(location.hash.slice(1));
    const id = h.startsWith('soft-') ? 'library' : h;
    requestAnimationFrame(() => document.getElementById(id)?.scrollIntoView({ block: 'start' }));
  }, [state.ok]);
  if (state.err) return <p className="px-6 py-24 muted">데이터를 읽지 못했습니다. 로컬 서버로 열었는지 확인하세요. ({state.err})</p>;
  if (!state.ok) return <p className="px-6 py-24 muted">불러오는 중…</p>;
  return <Main {...state} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
