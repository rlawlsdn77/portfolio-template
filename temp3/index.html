<!-- temp3 — 카트리지 포트폴리오 (직접 생성 모드)
     80년대 가정용 게임기 카트리지의 모양(손잡이 홈 · 오목한 라벨 창 · 아래 금속 접점 · 소프트마다 다른 껍데기 색)을 빌려 온 아래로 읽는 한 페이지.
     실제 회사·게임기의 이름·로고·라벨 그림은 쓰지 않습니다(모양과 색 인상만).
     흐름 = 카트리지 한 개를 앞에서 뒤, 속까지 본 뒤 소프트 선반 → 소프트 하나씩 (한눈에 보기는 기술 스택 바로 다음 — ../theme/layout-principles.md 원칙 3)
       #cover          앞면   — 내 카트리지(라벨 = 이름 · 영문 이름 · 한 줄 정체성 · 직무 · 연락처)
       #intro          뒷면   — 뒷면 스티커에 자기소개 원문 그대로
       #stack          속     — 기판 위 칩 하나 = 기술 하나(근거 문장 + 근거 프로젝트 칩)
       #glance         선반   — 카트리지 선반 + 꽂는 슬롯(꽂은 프로젝트의 제목 · 한 줄 소개 · 장르·기간 · 핵심 기술 · 역할 · 링크)
       #p-<폴더>       소프트 — 프로젝트 카트리지(라벨 = 대표 화면 · 제목 · 한 줄 소개, 누르면 발표 덱) + 상자 뒷면 사양(장르·기간·인원·환경 · 역할 · 개발 의도 · 태그 · 링크)
       #p-<폴더>-core  기능   — 화면 왼쪽 · FEATURE 목록 오른쪽(올리면 짝 강조, 화면을 누르면 크게)
       #contact        접점   — 연락처 + 프로젝트별 링크
     내용: ../data/portfolio.json · ../data/projects/*.json(기능 = highlights). UI 문구: ../theme/strings.tsv(원본 렌더러의 assets/strings.js로 읽음).
     공통 함수(글 조각 → HTML, 링크 규칙, 발표 덱 장면 찾기)는 원본 ../assets/common.js를 그대로 씁니다. 이 페이지는 그 파일들을 고치지 않습니다.
     카트리지 색: temp3/carts.js(발표 덱 temp3/deck.html과 같은 표). "No.01"·"SPEC"·"IC1" 같은 장식 라벨만 이 파일에 적혀 있습니다(사실이 아닌 차례·꾸밈).
     발표 덱 = temp3/deck.html(카트리지 덱), 상세 기술문서 = ../doc.html(원본). [포트폴리오 PDF] = 원본 ../index.html(A4 제출용)을 인쇄.
     배치 원칙: ../theme/layout-principles.md -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css">
<style>
  :root {
    --bg: #E7E2D8;
    --dot: rgb(29 28 34 / .07);
    --paper: #FBF7EF;
    --card: #FFFFFF;
    --ink: #1D1C22;
    --body: #3A3840;
    --muted: #67636C;
    --line: #D8D0C2;
    --line-2: #BDB4A5;
    --acc: #2F6FEB;
    --acc-ink: #2558C4;
    --acc-fill: #2F6FEB;
    --gold: #C29A35;
    --gold-hi: #EBCB6C;
    --pcb: #234E3A;
    --pcb-2: #2E6A4F;
    --dark: #2A2830;
    --sans: 'Pretendard', 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --disp: 'Bungee', 'Pretendard', system-ui, sans-serif;
    --mono: 'D2Coding', ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.34, 1.5, .64, 1);
    --top-h: 60px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top-h) + 14px); }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    word-break: keep-all; overflow-wrap: break-word;                                   /* 한글은 낱말 단위로만 꺾음(레이아웃 원칙 2) */
    background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.3px, transparent 1.7px); background-size: 22px 22px;   /* 바탕에만 까는 점 무늬 */
  }
  body.lb-open { overflow: hidden; }
  img { max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; border-radius: 6px; }
  ::selection { background: var(--acc); color: #fff; }
  .pf-sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  .pf-newtab-icon { display: inline-block; width: .72em; height: .72em; margin-left: .3em; vertical-align: .02em; flex: none; opacity: .8; }
  code { font-family: var(--mono); font-size: .88em; padding: 1px 6px; border-radius: 5px; background: rgb(29 28 34 / .07); overflow-wrap: anywhere; }
  .skip { position: absolute; left: 12px; top: -80px; z-index: 100; padding: 10px 14px; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 700; text-decoration: none; }
  .skip:focus { top: 12px; }
  .loading { margin: 30vh 0 0; text-align: center; color: var(--muted); font-weight: 600; }
  .notice { max-width: 680px; margin: 18vh auto; padding: 28px 32px; border-radius: 16px; background: var(--card); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--line-2); line-height: 1.7; }
  .notice h1 { margin: 0 0 10px; font-size: 26px; }
  .notice pre { padding: 10px 14px; border-radius: 8px; background: var(--ink); color: #F3EEE4; overflow-x: auto; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 768px) { .wrap { padding: 0 40px; } }

  /* ── 단추: 누르면 꺼지는 플라스틱 키 ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 11px; border: 2px solid var(--ink);
         background: var(--card); color: var(--ink); font: 700 15px/1 var(--sans); text-decoration: none; white-space: nowrap; cursor: pointer;
         box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s, background-color .15s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
  .btn.pri { background: var(--btn, var(--acc-fill)); color: #fff; }
  .btn.sm { height: 36px; padding: 0 13px; border-radius: 9px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
  .btn.sm:hover { box-shadow: 0 5px 0 var(--ink); }
  .btn .ico { width: 16px; height: 16px; flex: none; }
  .btn[aria-busy="true"] { opacity: .65; cursor: progress; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .play { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid currentColor; }

  /* ── 위 막대: 카트리지 윗면처럼 어둡게 + 아래 가장자리 금속 접점 ── */
  .top { position: sticky; top: 0; z-index: 40; height: var(--top-h); background: var(--ink); color: #EEE8DD; }
  .top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; pointer-events: none;
                background: repeating-linear-gradient(90deg, rgb(194 154 53 / .55) 0 6px, transparent 6px 10px); }
  .top-in { height: 100%; display: flex; align-items: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; color: #fff; text-decoration: none; font-size: 16px; font-weight: 800; white-space: nowrap; }
  .brand .en { font: 400 11px/1 var(--disp); letter-spacing: .06em; color: #A9A3AE; }
  .mini { position: relative; display: inline-block; flex: none; width: 26px; height: 20px; border-radius: 5px 5px 2px 2px; background: var(--acc);
          box-shadow: inset 0 -5px 0 rgb(0 0 0 / .28); }
  .mini::after { content: ''; position: absolute; left: 5px; right: 5px; top: 4px; height: 6px; border-radius: 2px; background: rgb(255 255 255 / .88); }
  .top nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .top nav::-webkit-scrollbar { display: none; }
  .top nav ul { display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .top nav a { position: relative; display: block; padding: 9px 12px; border-radius: 8px; color: #C9C3B8; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .top nav a:hover { background: #2D2C34; color: #fff; }
  .top nav a[aria-current="true"] { color: #fff; }
  .top nav a[aria-current="true"]::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 3px; border-radius: 1px;
                                            background: repeating-linear-gradient(90deg, var(--gold-hi) 0 4px, transparent 4px 6px); }
  .top .btn { flex: none; box-shadow: 0 3px 0 #000; border-color: #000; }
  @media (max-width: 640px) { .brand .en { display: none; } .top-in { gap: 10px; } .top .btn { padding: 0 10px; } }

  /* ── 절 머리 ── */
  .sec { position: relative; padding: 76px 0; }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 30px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin: 0; padding: 7px 11px 6px; border-radius: 7px; background: var(--ink); color: #F3EEE4;
             font: 400 12px/1 var(--disp); letter-spacing: .07em; }
  .eyebrow::before { content: ''; width: 10px; height: 10px; border-radius: 2px; background: var(--dotc, var(--acc)); }
  .sec-head h2 { margin: 14px 0 0; font-size: clamp(28px, 3vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
  .sec-r { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; }

  /* ════════ 카트리지(공통 부품) ════════
     .cart        = 겉(아래 접점이 보일 자리 14px)
     .cart-pins   = 기판 + 금속 접점(껍데기 밑에서 삐져나옴 — 들어 올리면 더 보임)
     .cart-shell  = 플라스틱 껍데기(위 밝고 아래 어둡게) · 안쪽 여백 = 위 책등 --pt / 옆 --px / 아래 --pb
     .cart-grip   = 양옆 위쪽 손잡이 홈 · .cart-top = 책등에 새긴 글자 · .cart-label = 오목한 라벨 창 · .cart-bottom = 홈 + 끼우는 방향 ▼ */
  .cart { --shell: #EDE6D4; --shell-on: #1D1C21; --pt: 40px; --px: 6.5%; --pb: 36px;
          position: relative; display: block; padding-bottom: 14px; isolation: isolate; perspective: 1400px; color: inherit; text-decoration: none; }
  .cart-shell {
    --lift: 0px; position: relative; z-index: 1; padding: var(--pt) var(--px) var(--pb); border-radius: 30px 30px 14px 14px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--shell) 70%, #fff) 0, var(--shell) 10px, var(--shell) calc(100% - 14px), color-mix(in srgb, var(--shell) 74%, #000) 100%);
    box-shadow: inset 3px 0 0 rgb(255 255 255 / .2), inset -3px 0 0 rgb(0 0 0 / .1), 0 2px 0 rgb(0 0 0 / .28), 0 28px 44px -26px rgb(0 0 0 / .6);
    transform: translateY(var(--lift)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transform-style: preserve-3d;
    transition: transform .3s var(--spring), box-shadow .3s;
  }
  .cart-grip { position: absolute; top: calc(var(--pt) + 8px); height: 46%; width: max(10px, 2.4%); border-radius: 3px;
               background: repeating-linear-gradient(180deg, rgb(0 0 0 / .24) 0 2px, rgb(255 255 255 / .28) 2px 3px, transparent 3px 9px); }
  .cart-grip.l { left: 2.1%; }
  .cart-grip.r { right: 2.1%; }
  .cart-top { position: absolute; left: var(--px); right: var(--px); top: 0; height: var(--pt); display: flex; align-items: center; gap: 10px; min-width: 0;
              color: var(--shell-on); font: 700 12px/1 var(--sans); }
  .cart-top .no { flex: none; padding: 5px 8px 4px; border-radius: 4px; font: 400 11px/1 var(--disp); letter-spacing: .06em; background: color-mix(in srgb, var(--shell-on) 14%, transparent); }
  .cart-top .t { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
  .cart-label { position: relative; border-radius: 12px; background: var(--paper); overflow: hidden;
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--shell) 64%, #000), 0 0 0 5px color-mix(in srgb, var(--shell) 84%, #fff); }
  /* 라벨 맨 위 인쇄 줄무늬(발표 덱 장면과 같은 무늬) */
  .cart-label::before { content: ''; position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 14px; pointer-events: none;
                        background: linear-gradient(var(--band, var(--shell)) 0 7px, transparent 7px 10px, var(--ink) 10px 12px, transparent 12px); }
  .cart-bottom { position: absolute; left: var(--px); right: var(--px); bottom: 0; height: var(--pb); display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--shell-on); }
  .groove { flex: 0 1 26%; height: 4px; border-radius: 2px; background: linear-gradient(rgb(0 0 0 / .24) 0 2px, rgb(255 255 255 / .3) 2px 4px); }
  .arrow { flex: none; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid color-mix(in srgb, var(--shell) 62%, #000); }
  .cart-pins { position: absolute; z-index: 0; left: 13%; right: 13%; bottom: 0; height: 26px; border-radius: 0 0 6px 6px;
               background: repeating-linear-gradient(90deg, transparent 0 4px, var(--gold) 4px 11px, transparent 11px 14px) 0 10px / 100% 13px no-repeat,
                           linear-gradient(var(--pcb), var(--pcb-2));
               box-shadow: 0 8px 14px -8px rgb(0 0 0 / .6); }
  /* 누를 수 있는 카트리지(프로젝트): 올리면 들리고 접점이 보임 · 누르면 꽂히듯 내려감 */
  a.cart:hover .cart-shell, a.cart:focus-visible .cart-shell { --lift: -10px; box-shadow: inset 3px 0 0 rgb(255 255 255 / .2), inset -3px 0 0 rgb(0 0 0 / .1), 0 2px 0 rgb(0 0 0 / .28), 0 40px 50px -28px rgb(0 0 0 / .65); }
  a.cart:focus-visible { outline: none; }
  a.cart:focus-visible .cart-label { outline: 3px solid var(--acc); outline-offset: 6px; }
  .cart .hint { display: inline-flex; align-items: center; gap: 8px; font: 800 13px/1 var(--sans); }
  .cart .hint b { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .3s var(--ease), opacity .2s; }
  a.cart:hover .hint b, a.cart:focus-visible .hint b { max-width: 12em; opacity: 1; }
  a.cart:hover .hint .arrow, a.cart:focus-visible .hint .arrow { border-top-color: currentColor; }
  .cart.inserting .cart-shell { animation: insert .45s var(--ease); }
  @keyframes insert { 0% { transform: translateY(-10px); } 45% { transform: translateY(12px); } 100% { transform: none; } }

  /* ════════ ① 앞면 — 내 카트리지 ════════ */
  .hero { padding: 44px 0 70px; }
  .hero-cart { max-width: 1120px; margin: 0 auto; --pt: 44px; --px: 6%; --pb: 38px; }
  .lab-hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); --band: var(--acc); }
  .lab-main { padding: 50px 42px 40px; min-width: 0; }
  .name { margin: 0; font-size: clamp(46px, 6.2vw, 84px); font-weight: 900; letter-spacing: -.045em; line-height: 1.02; }
  .name .en { display: block; margin-top: 14px; font: 400 clamp(15px, 1.7vw, 21px)/1.2 var(--disp); letter-spacing: .06em; color: var(--acc-ink); }
  .headline { margin: 26px 0 0; max-width: 30em; font-size: clamp(19px, 2vw, 25px); font-weight: 750; line-height: 1.45; letter-spacing: -.02em; }
  .job { margin: 8px 0 0; color: var(--muted); font-size: 15px; font-weight: 600; }
  .lab-main .btns { margin-top: 30px; }
  .lab-art { position: relative; display: grid; place-items: center; min-height: 280px; overflow: hidden; border-left: 3px solid var(--ink);
             background: repeating-linear-gradient(-32deg, var(--c1) 0 34px, var(--paper) 34px 42px, var(--c2) 42px 76px, var(--paper) 76px 84px, var(--c3) 84px 118px, var(--paper) 118px 126px); }
  .lab-art::before { content: ''; position: absolute; width: min(74%, 250px); aspect-ratio: 1; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 4px var(--ink); }
  .lab-art .mono { position: relative; font: 400 clamp(64px, 7vw, 104px)/1 var(--disp); letter-spacing: -.02em; color: var(--ink); text-shadow: 5px 5px 0 var(--acc); }
  @media (max-width: 820px) {
    .lab-hero { grid-template-columns: 1fr; }
    .lab-art { order: -1; min-height: 150px; border-left: 0; border-bottom: 3px solid var(--ink); }
    .lab-art::before { width: 118px; }
    .lab-art .mono { font-size: 50px; text-shadow: 3px 3px 0 var(--acc); }
    .lab-main { padding: 28px 24px 28px; }
  }

  /* ════════ ② 뒷면 — 자기소개 스티커 ════════ */
  .back { max-width: 1000px; margin: 0 auto; --pt: 50px; --px: 7%; --pb: 52px; }
  .back .cart-shell { background: linear-gradient(180deg, color-mix(in srgb, var(--shell) 80%, #fff) 0, var(--shell) 10px, color-mix(in srgb, var(--shell) 92%, #000) calc(100% - 14px), color-mix(in srgb, var(--shell) 74%, #000) 100%); }
  .ridges { position: absolute; left: 20%; right: 20%; top: 16px; height: 18px; border-radius: 3px;
            background: repeating-linear-gradient(180deg, rgb(0 0 0 / .2) 0 2px, rgb(255 255 255 / .3) 2px 3px, transparent 3px 6px); }
  .sticker { position: relative; padding: 34px 40px 32px; border-radius: 10px; background: var(--card);
             box-shadow: 0 0 0 2px color-mix(in srgb, var(--shell) 58%, #000), 0 3px 0 2px rgb(0 0 0 / .12); }
  .sticker::before { content: ''; display: block; height: 7px; margin-bottom: 22px; border-radius: 2px;
                     background: linear-gradient(var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 7px); }
  .sticker p { margin: 0; font-size: clamp(17px, 1.55vw, 20px); line-height: 1.85; color: var(--body); }
  .sticker p + p { margin-top: 16px; }
  .screw { position: absolute; bottom: 16px; width: 20px; height: 20px; border-radius: 50%;
           background: radial-gradient(circle at 38% 32%, #F6F3EC, #A39C90 72%); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .32), 0 1px 0 rgb(255 255 255 / .5); }
  .screw::before, .screw::after { content: ''; position: absolute; left: 4px; right: 4px; top: 9px; height: 2px; border-radius: 1px; background: rgb(0 0 0 / .45); transform: rotate(45deg); }
  .screw::after { transform: rotate(-45deg); }
  .screw.l { left: 5%; } .screw.r { right: 5%; }
  @media (max-width: 640px) { .back { --pt: 40px; --pb: 44px; } .sticker { padding: 24px 22px; } }

  /* ════════ ③ 속 — 기판 위 칩 = 기술 ════════ */
  .board { position: relative; padding: 42px 36px 62px; border-radius: 22px; background-color: var(--pcb);
           background-image: radial-gradient(circle, rgb(232 200 110 / .45) 0 2.5px, transparent 3px), linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px);
           background-size: 96px 96px, 24px 24px, 24px 24px; background-position: 12px 12px, 0 0, 0 0;
           box-shadow: inset 0 0 0 2px rgb(0 0 0 / .25), 0 26px 44px -28px rgb(0 0 0 / .65); }
  .board .edge { position: absolute; left: 8%; right: 8%; bottom: 0; height: 26px; border-radius: 2px 2px 0 0;
                 background: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 16px) 0 6px / 100% 20px no-repeat; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 34px 28px; margin: 0; padding: 0; list-style: none; }
  .chip { position: relative; margin: 14px 0; padding: 26px 24px 24px; border-radius: 8px; background: linear-gradient(#25242A, #18171C); color: #ECE7DD;
          box-shadow: 0 0 0 2px #0D0C10, 0 18px 26px -18px rgb(0 0 0 / .85); transition: transform .25s var(--spring); }
  .chip::before, .chip::after { content: ''; position: absolute; left: 18px; right: 18px; height: 14px; background: repeating-linear-gradient(90deg, #C7CBD0 0 7px, transparent 7px 15px); }
  .chip::before { top: -14px; border-radius: 2px 2px 0 0; }
  .chip::after { bottom: -14px; border-radius: 0 0 2px 2px; }
  .chip:hover { transform: translateY(-4px); }
  .chip .pin1 { position: absolute; left: 14px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: #3B3A42; box-shadow: inset 0 1px 2px rgb(0 0 0 / .7); }
  .chip-k { margin: 0 0 0 20px; font: 600 11px/1 var(--mono); letter-spacing: .1em; color: #8E8994; }
  .chip h3 { margin: 12px 0 16px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; color: #fff; }
  .chip ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .chip li { font-size: 15px; line-height: 1.62; color: #D7D1C7; }
  .chip li + li { padding-top: 12px; border-top: 1px dashed #3C3B43; }
  .chip code { background: #302F37; color: #F3D98B; }
  .pchip { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--shell); color: var(--shell-on);
           font: 700 12px/1.55 var(--sans); text-decoration: none; white-space: nowrap; vertical-align: 1px; transition: transform .15s var(--spring); }
  .pchip::before { content: ''; width: 9px; height: 7px; border-radius: 2px 2px 1px 1px; background: currentColor; opacity: .5; }
  .pchip:hover { transform: translateY(-2px); }

  /* ════════ ④ 소프트 — 프로젝트 카트리지 + 상자 뒷면 사양 ════════ */
  .proj { padding-top: 64px; }
  .proj-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .swap { display: flex; gap: 8px; flex-wrap: wrap; }
  .swap a { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 2px var(--ink);
            color: var(--ink); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform .15s var(--spring); }
  .swap a i { width: 11px; height: 9px; border-radius: 2px 2px 1px 1px; background: var(--s); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .25); }
  .swap a:hover { transform: translateY(-2px); }
  .proj-grid { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  .pcart { --pt: 40px; --px: 6.5%; --pb: 40px; }
  .lab-proj .lab-band { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 18px 12px; }
  .lab-band .no { flex: none; padding: 5px 9px 4px; border-radius: 5px; background: var(--ink); color: var(--paper); font: 400 12px/1 var(--disp); letter-spacing: .06em; }
  .lab-band .genre { min-width: 0; color: var(--muted); font-size: 13px; font-weight: 700; text-align: right; }
  .lab-cover { margin: 0 18px; border-radius: 8px; overflow: hidden; background: #111; box-shadow: 0 0 0 2px var(--ink); }
  .lab-cover img { display: block; width: 100%; height: auto; }
  .lab-title { padding: 18px 20px 22px; }
  .lab-title h2 { margin: 0; font-size: clamp(30px, 3.3vw, 44px); font-weight: 900; line-height: 1.1; letter-spacing: -.03em; }
  .lab-title h2.lat { font-family: var(--disp); font-weight: 400; letter-spacing: .01em; }
  .lab-title p { margin: 10px 0 0; color: var(--body); font-size: 15px; line-height: 1.62; }
  .spec { padding: 24px 26px 26px; border-radius: 16px; background: var(--card); border: 2px solid var(--ink); box-shadow: 7px 7px 0 var(--shell); }
  .spec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; padding-bottom: 12px; border-bottom: 2px solid var(--ink); font-size: 13px; font-weight: 700; }
  .spec-h .k { font: 400 12px/1 var(--disp); letter-spacing: .08em; }
  .meta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 20px; margin: 0; }
  .meta > div { min-width: 0; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .meta .wide { grid-column: 1 / -1; }
  .meta dt { font-size: 12px; font-weight: 800; letter-spacing: .02em; color: var(--p-acc, var(--acc-ink)); }
  .meta dd { margin: 3px 0 0; font-size: 15px; font-weight: 650; line-height: 1.5; }
  .intent { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--shell) 16%, var(--paper)); }
  .intent .k { margin: 0; font-size: 12px; font-weight: 800; color: var(--p-acc, var(--acc-ink)); }
  .intent p:last-child { margin: 4px 0 0; font-size: 16px; font-weight: 600; line-height: 1.65; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
  .tags li { padding: 3px 10px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); font-size: 13px; font-weight: 700; }
  .spec .btns { margin-top: 22px; }
  .proj .btn.pri, .core .btn.pri { --btn: var(--p-acc); }

  /* ════════ ⑤ 기능 소개 ════════ */
  .core { padding-top: 40px; }
  .fe { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 38px; align-items: start; }
  .fe.noshot { grid-template-columns: 1fr; }
  .fe.noshot .flist { grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
  .shots { display: grid; gap: 24px; }
  .shot { margin: 0; cursor: zoom-in; }
  .shot:focus-visible { outline: none; }
  .shot:focus-visible .shot-m { outline: 3px solid var(--acc); outline-offset: 6px; }
  .shot-m { border-radius: 12px; overflow: hidden; background: #111; box-shadow: 0 0 0 3px var(--ink), 7px 7px 0 3px var(--shell); transition: transform .2s var(--ease), box-shadow .2s; }
  .shot-m img { display: block; width: 100%; height: auto; }
  .shot figcaption { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .shot .n { flex: none; padding: 4px 7px 3px; border-radius: 5px; background: var(--shell); color: var(--shell-on); font: 400 11px/1 var(--disp); }
  .shot.on .shot-m, .shot:hover .shot-m { transform: translate(-3px, -3px); box-shadow: 0 0 0 3px var(--ink), 10px 10px 0 3px var(--shell); }
  .flist { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .f-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .flist li { padding: 16px 20px 17px; border-radius: 14px; background: var(--card); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--line-2); transition: transform .15s var(--ease), box-shadow .15s; }
  .flist li.on { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shell); }
  .fk { display: flex; align-items: center; gap: 10px; margin: 0; font: 400 12px/1 var(--disp); letter-spacing: .06em; color: var(--p-acc, var(--acc-ink)); }
  .mc { position: relative; flex: none; width: 24px; height: 18px; border-radius: 4px 4px 2px 2px; background: var(--shell); box-shadow: inset 0 -4px 0 rgb(0 0 0 / .24); }
  .mc::after { content: ''; position: absolute; left: 4px; right: 4px; top: 3px; height: 6px; border-radius: 1px; background: rgb(255 255 255 / .85); }
  .flist h3 { margin: 8px 0 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; }
  .flist p:not(.fk) { margin: 6px 0 0; color: var(--body); font-size: 15px; line-height: 1.62; }
  .flist .go { display: inline-flex; align-items: center; flex: none; padding: 5px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px currentColor;
               color: var(--p-acc, var(--acc-ink)); font-size: 13px; font-weight: 700; text-decoration: none; transition: background-color .15s, color .15s; }
  .flist .go:hover { background: var(--p-acc, var(--acc-ink)); color: #fff; }
  .fe .btns.end { margin-top: 20px; }

  /* ════════ ⑥ 한눈에 보기 — 카트리지 선반 + 꽂는 슬롯 ════════
     선반(.rack)의 카트리지를 누르거나 끌어다 슬롯(.console)에 놓으면 꽂히고, 옆 칸(.info)에 그 프로젝트의 요약이 뜸. 처음에는 첫 프로젝트가 꽂혀 있음 */
  .glance-in { display: grid; gap: 28px; }
  .rack { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 24px 22px; margin: 0; padding: 22px 24px 28px; list-style: none; border-radius: 20px;
          background: linear-gradient(#F4EFE6, #E9E2D5); box-shadow: inset 0 0 0 2px var(--line-2), inset 0 -14px 0 #D5CCBC, 0 18px 30px -24px rgb(0 0 0 / .45); }
  .rack::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: 22px; height: 3px; border-radius: 2px; background: rgb(0 0 0 / .12); }   /* 선반 턱 */
  .rk { position: relative; z-index: 1; flex: 0 1 206px; min-width: 0; }
  .rk::before { content: ''; position: absolute; inset: 0 0 14px; border-radius: 20px 20px 10px 10px; border: 2px dashed var(--line-2); opacity: 0; transition: opacity .2s; }   /* 빈 자리 */
  .rk.out::before { opacity: 1; }
  .rk-cart { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: grab; touch-action: manipulation; transition: opacity .25s, transform .3s var(--spring); }
  .rk-cart:focus-visible .cart-label { outline: 3px solid var(--acc); outline-offset: 5px; }
  .rk.out .rk-cart { opacity: 0; transform: translateY(-18px) scale(.96); pointer-events: none; }
  .mcart { --pt: 24px; --px: 9%; --pb: 20px; padding-bottom: 12px; }
  .mcart .cart-shell, .mcart .cart-label { display: block; }
  .rack { -webkit-user-select: none; user-select: none; }
  .rack img, .ghost img { -webkit-user-drag: none; }                /* 썸네일을 끌 때 브라우저 기본 "그림 끌기"가 끼어들지 않게 */
  .mcart .cart-shell { border-radius: 18px 18px 9px 9px; }
  .mcart .cart-pins { height: 20px; left: 16%; right: 16%; background-size: 100% 10px, auto; background-position: 0 8px, 0 0; }
  .mcart .cart-grip { width: max(6px, 3.4%); left: 2.6%; } .mcart .cart-grip.r { left: auto; right: 2.6%; }
  .mcart .cart-label::before { height: 9px; background: linear-gradient(var(--shell) 0 5px, transparent 5px 7px, var(--ink) 7px 8px, transparent 8px); }
  .mcart .groove { height: 3px; }
  .mcart .arrow { border-left-width: 5px; border-right-width: 5px; border-top-width: 6px; }
  .mcart .cart-top { font-size: 10px; } .mcart .cart-top .no { font-size: 9px; padding: 3px 5px 2px; }
  .m-thumb { display: block; margin: 14px 10px 0; border-radius: 5px; overflow: hidden; background: #111; box-shadow: 0 0 0 2px var(--ink); }
  .m-thumb img { display: block; width: 100%; height: auto; }
  .m-t { display: block; padding: 9px 12px 12px; font-size: 15px; font-weight: 900; line-height: 1.25; letter-spacing: -.02em; color: var(--ink); }
  .m-t.lat { font-family: var(--disp); font-weight: 400; font-size: 14px; letter-spacing: .02em; }
  .rk-cart:hover .cart-shell { --lift: -8px; }
  .rk-cart.dragging { opacity: .25; }
  .ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; transform: rotate(-4deg) scale(1.04); filter: drop-shadow(0 24px 24px rgb(0 0 0 / .35)); }

  .dock { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 32px; align-items: end; }
  /* 게임기(어떤 실제 제품도 아닌 모양): 윗면에 카트리지 구멍, 앞면에 불빛 · 꺼내기 단추 */
  .console { position: relative; height: 334px; }
  /* 아래 가장자리 = 슬롯 입구: 그 아래만 가림(꽂힌 부분). 위는 가리지 않아 제목이 두 줄인 카트리지도 잘리지 않음 */
  .bay { position: absolute; left: 50%; bottom: 132px; width: 270px; height: 196px; transform: translateX(-50%); z-index: 1; clip-path: inset(-600px -60px 0 -60px); }
  .bay .seat { position: absolute; left: 0; right: 0; bottom: -32px; transform: translateY(0); }   /* 접점·아래 홈만 슬롯 안으로(라벨 글자는 보이게) */
  .bay .seat.in { animation: seat-in .55s var(--spring); }
  .bay .seat.outgo { animation: seat-out .32s var(--ease) forwards; }
  @keyframes seat-in { 0% { transform: translateY(-120%); } 70% { transform: translateY(8px); } 100% { transform: translateY(0); } }
  @keyframes seat-out { to { transform: translateY(-115%); opacity: 0; } }
  .bay .seat .mcart { pointer-events: none; }
  .bay .hint { position: absolute; left: 0; right: 0; bottom: 18px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.45; }
  .bay .hint::before { content: ''; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 12px solid var(--line-2); animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }
  .bay.full .hint { display: none; }
  .c-top { position: absolute; left: 0; right: 0; bottom: 92px; height: 58px; border-radius: 22px 22px 6px 6px; z-index: 0;
           background: linear-gradient(#45424C, #37353D); box-shadow: inset 0 2px 0 rgb(255 255 255 / .1), 0 2px 0 rgb(0 0 0 / .3); }
  .mouth { position: absolute; left: 50%; bottom: 128px; width: 296px; height: 16px; transform: translateX(-50%); z-index: 2; border-radius: 4px;
           background: linear-gradient(#0B0A0D, #1C1A20); box-shadow: inset 0 3px 4px rgb(0 0 0 / .9), 0 1px 0 rgb(255 255 255 / .12); transition: box-shadow .2s; }
  .mouth::before { content: ''; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; background: rgb(0 0 0 / .6); }
  .c-body { position: absolute; left: 0; right: 0; bottom: 0; height: 100px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 26px;
            border-radius: 6px 6px 20px 20px; background: linear-gradient(#2E2C33, #232127); box-shadow: inset 0 2px 0 rgb(255 255 255 / .08), 0 24px 34px -22px rgb(0 0 0 / .7); }
  .c-vent { flex: 1; height: 28px; max-width: 120px; border-radius: 3px; background: repeating-linear-gradient(90deg, #17161A 0 4px, transparent 4px 9px); }
  .c-led { display: flex; align-items: center; gap: 8px; color: #8E8994; font: 400 10px/1 var(--disp); letter-spacing: .08em; }
  .c-led i { width: 11px; height: 11px; border-radius: 50%; background: #4A1D1D; box-shadow: inset 0 1px 2px rgb(0 0 0 / .6); transition: background-color .2s, box-shadow .2s; }
  .console.on .c-led i { background: #FF5A4A; box-shadow: 0 0 10px 2px rgb(255 90 74 / .7); }
  .eject { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 8px; cursor: pointer;
           background: #E9E3D8; color: var(--ink); font: 400 11px/1 var(--disp); letter-spacing: .08em; box-shadow: 0 4px 0 #8E877C; transition: transform .08s, box-shadow .08s; }
  .eject:hover { background: #fff; }
  .eject:active { transform: translateY(4px); box-shadow: 0 0 0 #8E877C; }
  .eject:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
  .eject[disabled] { opacity: .45; cursor: default; transform: none; }
  .console.drop .mouth { box-shadow: inset 0 3px 4px rgb(0 0 0 / .9), 0 0 0 3px var(--gold-hi), 0 0 18px 4px rgb(235 203 108 / .6); }
  .console.drop .bay .hint { color: var(--ink); }

  .info { min-height: 330px; padding: 26px 28px 28px; border-radius: 18px; background: var(--card); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--shell, var(--line-2)); transition: box-shadow .3s; }
  .info.flash { animation: info-in .4s var(--ease); }
  @keyframes info-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .info-no { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
  .info-no .no { padding: 5px 9px 4px; border-radius: 5px; background: var(--shell); color: var(--shell-on); font: 400 12px/1 var(--disp); letter-spacing: .06em; }
  .info h3 { margin: 14px 0 0; font-size: clamp(28px, 3vw, 38px); font-weight: 900; letter-spacing: -.03em; line-height: 1.12; }
  .info h3.lat { font-family: var(--disp); font-weight: 400; letter-spacing: .01em; }
  .info .tl { margin: 10px 0 0; color: var(--body); font-size: 16px; line-height: 1.62; }
  .info-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 14px 0 0; font-size: 14px; }
  .info-meta div { display: flex; gap: 8px; min-width: 0; }
  .info-meta dt { font-weight: 800; color: var(--p-acc, var(--acc-ink)); }
  .info-meta dd { margin: 0; font-weight: 600; }
  .info .tags { margin-top: 14px; }
  .info-role { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--shell) 16%, var(--paper)); font-size: 14px; line-height: 1.6; }
  .info-role b { margin-right: 6px; color: var(--p-acc, var(--acc-ink)); }
  .info .btns { margin-top: 20px; }
  .info .btn.pri { --btn: var(--p-acc); }
  .info-empty { display: grid; place-items: center; min-height: 270px; color: var(--muted); font-size: 15px; font-weight: 700; text-align: center; }
  @media (max-width: 960px) {
    .dock { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .console { max-width: 420px; width: 100%; margin: 0 auto; }
  }
  @media (max-width: 640px) {
    .rack { gap: 16px 10px; padding: 16px 12px 26px; }
    .rk { flex-basis: calc((100% - 20px) / 3); }                     /* 휴대폰: 작은 카트리지 3개씩 */
    .rack .mcart { --pt: 14px; --px: 8%; --pb: 14px; }
    .rack .mcart .cart-top { display: none; }
    .rack .m-thumb { margin: 10px 6px 0; }
    .rack .m-t { padding: 6px 7px 8px; font-size: 12px; }
    .rack .m-t.lat { font-size: 10px; }
    .console { height: 310px; }
    .bay { width: 230px; height: 172px; }
    .mouth { width: 252px; }
    .c-body { padding: 0 16px; }
    .c-vent { display: none; }
    .info { padding: 20px 18px; box-shadow: 5px 5px 0 var(--shell, var(--line-2)); }
  }

  /* ════════ ⑦ 연락처 — 아래 가장자리 접점 ════════ */
  .contact { margin-top: 30px; padding-bottom: 60px; background: var(--ink); color: #EEE8DD; }
  .pins-edge { display: block; height: 24px; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 16px) 0 0 / 100% 16px no-repeat, var(--pcb); }
  .ct { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; padding-top: 56px; }
  .contact .eyebrow { background: #F3EEE4; color: var(--ink); }
  .ct-name { margin: 18px 0 0; font-size: clamp(30px, 3.6vw, 46px); font-weight: 900; letter-spacing: -.03em; }
  .ct-mail { margin: 14px 0 0; }
  .ct-mail a { color: #fff; font-size: clamp(18px, 2vw, 24px); font-weight: 700; text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 7px; }
  .ct-gh { margin: 12px 0 0; }
  .ct-gh a, .ct-x a { color: #CFC9BE; font-family: var(--mono); font-size: 15px; text-underline-offset: 4px; }
  .ct-x { margin: 8px 0 0; color: #A9A3AE; font-size: 14px; }
  .ct-me .btn { margin-top: 28px; background: transparent; color: #EEE8DD; border-color: #EEE8DD; box-shadow: 0 3px 0 #EEE8DD; }
  .ct-lk { display: grid; gap: 12px; align-content: start; }
  .ct-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; background: #2A2930; box-shadow: inset 0 0 0 1px #3A3941; }
  .ct-row b { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; min-width: 0; }
  .ct-row .row { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: flex-end; font-size: 14px; font-weight: 600; }
  .ct-row .row a { color: #CFC9BE; text-underline-offset: 4px; }
  .ct-row .row a:hover { color: #fff; }
  @media (max-width: 880px) { .ct { grid-template-columns: 1fr; } .ct-row { grid-template-columns: 1fr; } .ct-row .row { justify-content: flex-start; } }

  /* ── 좁은 화면: 한 줄로 ── */
  @media (max-width: 1023px) {
    .proj-grid, .fe { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  }
  @media (max-width: 640px) {
    .sec { padding: 56px 0; }
    .cart, .hero-cart, .pcart { --pt: 34px; --px: 7%; --pb: 32px; }
    .cart-shell { border-radius: 20px 20px 10px 10px; }
    .lab-proj .lab-band { padding: 20px 12px 10px; }
    .lab-cover { margin: 0 12px; }
    .lab-title { padding: 14px 14px 18px; }
    .spec { padding: 20px 18px; box-shadow: 5px 5px 0 var(--shell); }
    .meta { grid-template-columns: minmax(0, 1fr); }
    .board { padding: 30px 18px 52px; }
    .btn { height: 44px; }
  }

  /* ── 화면 크게 보기 ── */
  .lb { max-width: none; max-height: none; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; background: transparent; overflow: hidden; }
  .lb[open] { display: grid; place-items: center; }
  .lb::backdrop { background: rgb(20 19 24 / .88); }
  .lb figure { margin: 0; padding: 60px 72px 40px; max-width: 100%; }
  .lb img { display: block; max-width: min(1280px, calc(100vw - 144px)); max-height: calc(100vh - 150px); width: auto; height: auto; margin: 0 auto; border-radius: 10px; box-shadow: 0 0 0 3px #000, 0 30px 60px -20px #000; }
  .lb figcaption { margin-top: 14px; color: #EEE8DD; font-size: 15px; text-align: center; line-height: 1.5; }
  .lb-b { position: fixed; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; border: 2px solid #000; background: #F3EEE4; color: var(--ink);
          font: 800 22px/1 var(--sans); cursor: pointer; box-shadow: 0 4px 0 #000; }
  .lb-b:active { transform: translateY(4px); box-shadow: none; }
  .lb-x { right: 18px; top: 18px; }
  .lb-p { left: 14px; top: 50%; }
  .lb-n { right: 14px; top: 50%; }
  .lb-b[hidden] { display: none; }
  @media (max-width: 640px) { .lb figure { padding: 70px 12px 30px; } .lb img { max-width: calc(100vw - 24px); } .lb-p, .lb-n { top: auto; bottom: 14px; } }

  /* ── 나타나기(움직임 줄이기 설정이면 없음) ── */
  html.rv-on .rv { opacity: 0; transform: translateY(26px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
  html.rv-on .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    .top, .skip, .lb, .swap, .no-print { display: none !important; }
    body { background: #fff; }
    .sec { padding: 24px 0; break-inside: avoid; }
    .rv { opacity: 1 !important; transform: none !important; }
    .cart-shell, .spec, .shot-m, .chip { box-shadow: none !important; }
  }
</style>
<link rel="stylesheet" href="../theme/typeset.css"><!-- 줄바꿈 규칙(짧은 끝줄 막기): theme/layout-principles.md 원칙 2 — 맨 마지막 -->
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div id="app"><p class="loading">불러오는 중…</p></div>
<noscript><div class="notice"><h1>JavaScript를 켜 주세요</h1><p>이 포트폴리오는 data/의 내용을 읽어 브라우저에서 그립니다. JavaScript를 켠 뒤 다시 열어 주세요.</p></div></noscript>
<script src="../assets/strings.js"></script><!-- 원본 문구 표(기본 문구) — theme/strings.tsv는 아래에서 ../ 경로로 읽음 -->
<script src="../assets/common.js"></script><!-- 원본 공통 함수(PF.inline · PF.link · PF.deckSceneFor …) -->
<script src="carts.js"></script><!-- 카트리지 색 표(발표 덱과 공용) -->
<script>
(() => {
  const app = document.getElementById('app');
  const root = document.documentElement;
  const info = { ready: 'no', errors: [], sections: [], projects: 0 };
  const waiters = [];
  const finish = () => { info.ready = 'yes'; root.dataset.pfReady = 'yes'; waiters.splice(0).forEach((f) => f()); };
  // 미리보기 점검: await T3Page.whenReady() 뒤 T3Page.report() — 깨진 그림 · 가로 넘침 · 오류 · 문구 표 · 절 높이(1280×800 기준 약 1,000px 이내)
  window.T3Page = { whenReady: () => (info.ready === 'yes' ? Promise.resolve() : new Promise((r) => waiters.push(r))), report };

  if (typeof PF !== 'object' || typeof PFStr !== 'object' || !window.T3Carts) {
    app.innerHTML = '<div class="notice"><h1>페이지를 그리지 못했습니다</h1><p>../assets/common.js · ../assets/strings.js · carts.js를 불러오지 못했습니다. 로컬 서버로 레포 맨 위 폴더를 열었는지 확인해 주세요.</p></div>';
    info.errors.push('missing-scripts');
    finish();
    return;
  }
  const { esc, inline, isUrl, shortUrl } = PF;
  const t = (k, v) => PF.t(k, v);
  const T = (k, v) => esc(PF.t(k, v));
  const pad2 = (n) => String(n).padStart(2, '0');
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const img = (p, rel) => `../${PF.srcPath(p.id, rel)}`;
  // 발표 덱 = temp3 카트리지 덱(같은 폴더의 deck.html). 원본 덱은 ../project.html
  const deckUrl = (p, sid = '') => `deck.html?p=${encodeURIComponent(p.id)}${sid ? `#s=${sid}` : ''}`;
  const docUrl = (p) => `../${PF.docUrl(p.id)}`;
  const isLatin = (s) => !/[ᄀ-ᇿ㄰-㆏가-힯]/.test(String(s || ''));
  const metaOf = (p, re) => ((p.meta || []).find((m) => re.test(m.label || '')) || {}).value || '';
  // 영문 이름의 머리글자(라벨 그림 장식) — 영문 이름이 없으면 이름 첫 글자
  const initials = (en, ko) => {
    const w = String(en || '').trim().split(/\s+/).filter(Boolean);
    return (w.length ? w.map((x) => x[0]).join('') : String(ko || '').slice(0, 1)).slice(0, 3).toUpperCase();
  };
  const btn = (href, label, kind, cls = 'btn') => PF.link({ href, label, kind, cls });
  const ICON_MAIL = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12v9H2z M2 4l6 5 6-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  const ICON_CODE = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4 1.8 8l3.7 4M10.5 4l3.7 4-3.7 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  start().catch((err) => {
    info.errors.push(String((err && err.stack) || err));
    app.innerHTML = `<div class="notice"><h1>아직 포트폴리오 데이터가 없습니다</h1>${PF.noDataHtml(err)}</div>`;
  }).finally(finish);

  async function start() {
    if (PF.isFile()) { app.innerHTML = `<div class="notice"><h1>로컬 서버로 열어 주세요</h1>${PF.FILE_HELP}</div>`; return; }
    const [pf] = await Promise.all([PF.loadJSON('../data/portfolio.json'), PFStr.load('../theme/strings.tsv')]);
    const ids = pf.projects || [];
    const projects = (await Promise.all(ids.map((id) => PF.loadJSON(`../data/projects/${encodeURIComponent(id)}.json`)
      .catch((e) => { info.errors.push(`data/projects/${id}.json: ${e.message}`); return null; })))).filter(Boolean);
    applyAccent(pf.settings && pf.settings.accent);
    render(pf, projects, ids);
    toHash();
    bind();
  }

  // 주소의 #절(발표 덱의 [← 포트폴리오] = #p-<폴더>)로 — 내용을 늦게 그리므로 브라우저 기본 이동이 닿지 않음. 원본과 같은 절 id
  function toHash() {
    let id = '';
    try { id = decodeURIComponent(location.hash.slice(1)); } catch { id = location.hash.slice(1); }
    const el = id && document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'instant' });
  }

  // ── 강조색(profile.md) → 종이 위 글자용(4.8:1 이상) · 흰 글자를 올리는 칠(4.5:1 이상) ──
  function applyAccent(hex) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return;
    const A = PF.hexRgb(hex), PAPER = PF.hexRgb('#FBF7EF'), WHITE = [255, 255, 255], BLACK = [0, 0, 0];
    const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
    const hx = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
    const darkTo = (bg, need) => { let c = A; for (let k = 0; k <= 1 && PF.contrast(c, bg) < need; k += 0.02) c = mix(A, BLACK, k); return hx(c); };
    root.style.setProperty('--acc', hex);
    root.style.setProperty('--acc-ink', darkTo(PAPER, 4.8));
    root.style.setProperty('--acc-fill', darkTo(WHITE, 4.5));
  }

  // ── 카트리지 한 개(껍데기 · 손잡이 홈 · 책등 · 라벨 · 아래 홈 · 접점) ──
  function cart({ cls = '', shell, top = '', label = '', bottom = '', tag = 'div', attrs = '' }) {
    const foot = bottom || '<i class="groove"></i><i class="arrow"></i><i class="groove"></i>';
    return `<${tag} class="cart ${cls}" style="${T3Carts.vars(shell)}"${attrs}>
      <i class="cart-pins" aria-hidden="true"></i>
      <div class="cart-shell"><i class="cart-grip l" aria-hidden="true"></i><i class="cart-grip r" aria-hidden="true"></i>
        ${top ? `<div class="cart-top">${top}</div>` : ''}${label}
        <div class="cart-bottom" aria-hidden="true">${foot}</div></div></${tag}>`;
  }
  const head = (eyebrow, title, right = '', dot = '') => `<div class="sec-head"><div><p class="eyebrow"${dot ? ` style="--dotc:${dot}"` : ''}>${esc(eyebrow)}</p><h2>${esc(title)}</h2></div>${right ? `<p class="sec-r">${esc(right)}</p>` : ''}</div>`;
  const G = { projects: [], shells: [] };                       // 한눈에 보기 슬롯이 쓰는 프로젝트 목록
  // 작은 카트리지(선반 · 슬롯) — 단추 안에 들어가므로 span으로만
  const miniCart = (p, j, s) => `<span class="cart mcart" style="${T3Carts.vars(s)}"><i class="cart-pins" aria-hidden="true"></i>
    <span class="cart-shell"><i class="cart-grip l" aria-hidden="true"></i><i class="cart-grip r" aria-hidden="true"></i>
      <span class="cart-top" aria-hidden="true"><span class="no">No.${pad2(j + 1)}</span></span>
      <span class="cart-label">${p.cover ? `<span class="m-thumb"><img src="${esc(img(p, p.cover))}" alt="" loading="lazy" decoding="async" draggable="false"></span>` : ''}<span class="m-t${isLatin(p.title) ? ' lat' : ''}">${esc(p.title)}</span></span>
      <span class="cart-bottom" aria-hidden="true"><i class="groove"></i><i class="arrow"></i><i class="groove"></i></span></span></span>`;
  const projLinks = (p) => [PF.link({ href: deckUrl(p), label: T('name.deck'), kind: 'page' }), PF.link({ href: docUrl(p), label: T('name.doc-short'), kind: 'page' }),
    isUrl(p.links && p.links.github) && PF.link({ href: p.links.github, label: 'GitHub' }), isUrl(p.links && p.links.video) && PF.link({ href: p.links.video, label: T('name.video') })].filter(Boolean).join('');

  function render(pf, projects, ids) {
    const prof = pf.profile || {};
    const name = prof.name || '';
    const total = projects.length;
    const shells = projects.map((p) => T3Carts.pick(p.id, ids));
    const links = (prof.links || []).filter((l) => isUrl(l.url));
    const out = [];

    // ① 앞면: 내 카트리지
    const art = shells.length ? shells : T3Carts.SHELLS;
    const c = (i) => (art[i % art.length] || T3Carts.SHELLS[i]).shell;
    const heroBtns = [prof.email && PF.link({ href: `mailto:${prof.email}`, label: `${ICON_MAIL}<span>${esc(prof.email)}</span>`, kind: 'mail', cls: 'btn pri' }),
      isUrl(prof.github) && btn(prof.github, `${ICON_CODE}<span>GitHub</span>`, 'external'), ...links.map((l) => btn(l.url, esc(l.label), 'external'))].filter(Boolean).join('');
    out.push(`<section id="cover" class="hero"><div class="wrap">${cart({ cls: 'hero-cart rv', shell: T3Carts.PLAYER, attrs: ' data-tilt',
      top: `<span class="no">${T('en.portfolio')}</span>${pf.generatedAt ? `<span class="t">${T('page.updated', { date: pf.generatedAt })}</span>` : ''}`,
      label: `<div class="cart-label lab-hero">
        <div class="lab-main"><h1 class="name">${esc(name)}${prof.nameEn ? `<span class="en" lang="en">${esc(prof.nameEn)}</span>` : ''}</h1>
          ${prof.headline ? `<p class="headline">${inline(prof.headline)}</p>` : ''}${prof.job ? `<p class="job">${inline(prof.job)}</p>` : ''}
          ${heroBtns ? `<div class="btns">${heroBtns}</div>` : ''}</div>
        <div class="lab-art" aria-hidden="true" style="--c1:${c(0)};--c2:${c(1)};--c3:${c(2)}"><span class="mono">${esc(initials(prof.nameEn, name))}</span></div></div>` })}</div></section>`);

    // ② 뒷면: 자기소개(원문 그대로)
    if (prof.intro) {
      const paras = prof.intro.split(/\n+/).filter((l) => l.trim()).map((l) => `<p>${inline(l)}</p>`).join('');
      out.push(`<section id="intro" class="sec"><div class="wrap">${head(t('en.about'), t('page.intro'))}
        <div class="cart back rv" style="${T3Carts.vars(T3Carts.PLAYER)}"><i class="cart-pins" aria-hidden="true"></i>
          <div class="cart-shell"><i class="ridges" aria-hidden="true"></i><div class="sticker">${paras}</div>
            <i class="screw l" aria-hidden="true"></i><i class="screw r" aria-hidden="true"></i></div></div></div></section>`);
    }

    // ③ 속: 기판 위 칩 = 기술(근거 문장 + 근거 프로젝트)
    const byId = Object.fromEntries(projects.map((p, j) => [p.id, { p, s: shells[j] }]));
    if ((pf.skills || []).length) {
      out.push(`<section id="stack" class="sec"><div class="wrap">${head(t('en.skills'), t('page.stack'), t('page.stack-note'))}
        <div class="board rv"><ul class="chips">${pf.skills.map((s, i) => `<li class="chip"><i class="pin1" aria-hidden="true"></i><p class="chip-k" aria-hidden="true">IC${i + 1}</p>
          <h3>${esc(s.name)}</h3><ul>${(s.evidence || []).map((e) => {
            const b = byId[e.project];
            return `<li><span>${inline(e.text)}</span>${b ? `<a class="pchip" href="#p-${esc(b.p.id)}" style="${T3Carts.vars(b.s)}">${esc(b.p.title)}</a>` : ''}</li>`;
          }).join('')}</ul></li>`).join('')}</ul><i class="edge" aria-hidden="true"></i></div></div></section>`);
    }

    // ④ 한눈에 보기(기술 스택 바로 다음 — 레이아웃 원칙 3): 카트리지 선반 + 꽂는 슬롯(꽂은 프로젝트의 요약이 옆 칸에). 처음에는 첫 프로젝트가 꽂혀 있음(bind → dock)
    G.projects = projects; G.shells = shells;
    if (total) {
      out.push(`<section id="glance" class="sec"><div class="wrap">${head(t('en.glance'), t('page.glance'))}
        <div class="glance-in">
          <ul class="rack rv" aria-label="프로젝트 카트리지 — 누르거나 끌어다 슬롯에 꽂기">${projects.map((p, j) => `<li class="rk" data-i="${j}">
            <button type="button" class="rk-cart" data-i="${j}" aria-pressed="false" aria-controls="dock-info" aria-label="${esc(p.title)} — 슬롯에 꽂기">${miniCart(p, j, shells[j])}</button></li>`).join('')}</ul>
          <div class="dock rv">
            <div class="console">
              <i class="c-top" aria-hidden="true"></i>
              <div class="bay" aria-hidden="true"><span class="seat"></span><span class="hint">카트리지를 누르거나<br>끌어다 놓으세요</span></div>
              <i class="mouth" aria-hidden="true"></i>
              <div class="c-body"><span class="c-led" aria-hidden="true"><i></i>SLOT</span><span class="c-vent" aria-hidden="true"></span>
                <button type="button" class="eject" disabled aria-label="카트리지 꺼내기">EJECT <span aria-hidden="true">▲</span></button></div>
            </div>
            <div class="info" id="dock-info" aria-live="polite"></div>
          </div>
        </div></div></section>`);
    }

    // ⑤⑥ 프로젝트마다 카트리지(소개) + 기능 소개
    projects.forEach((p, j) => {
      out.push(projectIntro(p, j, total, shells, projects));
      const fe = features(p, j, total, shells[j]);
      if (fe) out.push(fe);
    });

    // ⑦ 연락처
    out.push(`<footer id="contact" class="contact"><i class="pins-edge" aria-hidden="true"></i><div class="wrap"><div class="ct">
      <div class="ct-me"><p class="eyebrow">${T('en.contact')}</p><p class="ct-name">${esc(name)}</p>
        ${prof.email ? `<p class="ct-mail">${PF.link({ href: `mailto:${prof.email}`, label: esc(prof.email), kind: 'mail' })}</p>` : ''}
        ${isUrl(prof.github) ? `<p class="ct-gh">${PF.link({ href: prof.github, label: esc(shortUrl(prof.github)) })}</p>` : ''}
        ${links.map((l) => `<p class="ct-x">${esc(l.label)} ${PF.link({ href: l.url, label: esc(shortUrl(l.url)) })}</p>`).join('')}
        <a class="btn sm" href="#cover"><span aria-hidden="true">▲</span> ${T('doc.top')}</a></div>
      <div class="ct-lk">${projects.map((p, j) => `<div class="ct-row" style="${T3Carts.vars(shells[j])}"><b><i class="mc" aria-hidden="true"></i>${esc(p.title)}</b><span class="row">${projLinks(p)}</span></div>`).join('')}</div>
    </div></div></footer>`);

    const nav = [['intro', t('page.nav-intro'), prof.intro], ['stack', t('page.nav-stack'), (pf.skills || []).length], ['glance', t('page.nav-glance'), total],
      [projects[0] ? `p-${projects[0].id}` : '', t('page.nav-projects'), total], ['contact', t('page.nav-contact'), true]].filter((x) => x[0] && x[2]);
    app.innerHTML = `<header class="top"><div class="wrap top-in">
        <a class="brand" href="#cover"><i class="mini" aria-hidden="true"></i><span>${esc(name)}</span>${prof.nameEn ? `<span class="en" lang="en">${esc(prof.nameEn)}</span>` : ''}</a>
        <nav aria-label="절 이동"><ul>${nav.map(([id, label]) => `<li><a href="#${esc(id)}" data-nav="${esc(id)}">${esc(label)}</a></li>`).join('')}</ul></nav>
        <button type="button" class="btn sm" data-pdf title="원본 포트폴리오 문서(A4)를 인쇄합니다">${T('ui.pdf')}</button></div></header>
      <main id="main">${out.join('')}</main>`;
    document.title = name ? `${name} · ${t('name.portfolio')}` : t('name.portfolio');
    info.sections = [...app.querySelectorAll('main > section[id], main > footer[id]')].map((s) => s.id);
    info.projects = total;
  }

  // 프로젝트 소개: 카트리지(라벨 = 대표 화면 · 제목 · 한 줄 소개, 누르면 발표 덱) + 상자 뒷면 사양
  function projectIntro(p, j, total, shells, projects) {
    const shell = shells[j];
    const no = t('page.project-no', { no: pad2(j + 1), total: pad2(total) });
    const genre = metaOf(p, /장르|genre/i);
    const meta = (p.meta || []).map((m) => `<div><dt>${esc(m.label)}</dt><dd>${inline(m.value)}</dd></div>`);
    if (p.team && p.team.role) meta.push(`<div class="wide"><dt>${T('name.role')}</dt><dd>${inline(p.team.role)}</dd></div>`);
    const extra = ((p.links && p.links.extra) || []).filter((l) => isUrl(l.url));
    const btns = [btn(deckUrl(p), `<span class="play" aria-hidden="true"></span>${T('name.deck')}`, 'page', 'btn pri'), btn(docUrl(p), T('name.doc'), 'page'),
      isUrl(p.links && p.links.github) && btn(p.links.github, 'GitHub', 'external'), isUrl(p.links && p.links.video) && btn(p.links.video, T('name.video'), 'external'),
      ...extra.map((l) => btn(l.url, esc(l.label), 'external'))].filter(Boolean).join('');
    // 옆 카트리지로 바꿔 끼우기(이전 · 다음 프로젝트)
    const swap = [j > 0 && [projects[j - 1], shells[j - 1], '◀ '], j < total - 1 && [projects[j + 1], shells[j + 1], ' ▶']].filter(Boolean)
      .map(([q, s, mark]) => `<a href="#p-${esc(q.id)}" style="--s:${s.shell}">${mark === '◀ ' ? '<span aria-hidden="true">◀</span>' : ''}<i aria-hidden="true"></i>${esc(q.title)}${mark === ' ▶' ? '<span aria-hidden="true">▶</span>' : ''}</a>`).join('');
    const label = `<div class="cart-label lab-proj">
        <div class="lab-band"><span class="no">No.${pad2(j + 1)}</span>${genre ? `<span class="genre">${esc(genre)}</span>` : ''}</div>
        ${p.cover ? `<figure class="lab-cover" style="margin-block:0"><img src="${esc(img(p, p.cover))}" alt="${esc(p.title)} 대표 화면" loading="lazy" decoding="async"></figure>` : ''}
        <div class="lab-title"><h2${isLatin(p.title) ? ' class="lat"' : ''}>${esc(p.title)}</h2>${p.tagline ? `<p>${inline(p.tagline)}</p>` : ''}</div></div>`;
    const cartHtml = cart({ cls: 'pcart rv', shell, tag: 'a', label,
      attrs: ` href="${esc(deckUrl(p))}" target="_blank" rel="noopener" data-tilt aria-label="${esc(p.title)} — ${T('name.deck')} (새 탭)"`,
      bottom: `<i class="groove"></i><span class="hint"><i class="arrow"></i><b>${T('name.deck')}</b></span><i class="groove"></i>` });
    const spec = `<div class="spec rv"><p class="spec-h"><span class="k">SPEC</span><span>${esc(PF.teamLabel(p.team))}</span></p>
        ${meta.length ? `<dl class="meta">${meta.join('')}</dl>` : ''}
        ${p.intent && p.intent.text ? `<div class="intent"><p class="k">${T('name.intent')}</p><p>${inline(p.intent.text)}</p></div>` : ''}
        ${(p.tags || []).length ? `<ul class="tags">${p.tags.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <div class="btns">${btns}</div></div>`;
    return `<section id="p-${esc(p.id)}" class="sec proj" style="${T3Carts.vars(shell)}--p-acc:${shell.ink};">
      <div class="wrap"><div class="proj-top"><p class="eyebrow" style="--dotc:${shell.shell}">${esc(no)}</p>${swap ? `<nav class="swap" aria-label="다른 프로젝트">${swap}</nav>` : ''}</div>
      <div class="proj-grid">${cartHtml}${spec}</div></div></section>`;
  }

  // 기능 소개: 화면은 왼쪽(번호와 함께, 누르면 크게), FEATURE 번호 + 제목 + 설명 + [발표 덱에서 보기]는 오른쪽 목록. 화면이 하나도 없으면 목록만
  function features(p, j, total, shell) {
    const hl = (p.highlights || []).slice(0, 4);
    if (!hl.length) return '';
    const cap = (x) => (typeof x === 'string' ? x : (x && x.text) || '');
    const shots = hl.map((h, i) => ({ h, i })).filter(({ h }) => h.image && h.image.src);
    const tiles = shots.map(({ h, i }) => {
      const d = h.image.w && h.image.h ? ` width="${h.image.w}" height="${h.image.h}"` : '';
      const c = cap(h.image.caption) || h.title;
      return `<figure class="shot" data-fi="${i}" tabindex="0" role="button" aria-label="${esc(PF.normTitle(c))} — ${T('doc.zoom')}">
        <div class="shot-m"><img src="${esc(img(p, h.image.src))}" alt="${esc(PF.normTitle(c))}"${d} loading="lazy" decoding="async"></div>
        <figcaption><span class="n">${pad2(i + 1)}</span><span>${inline(c)}</span></figcaption></figure>`;
    }).join('');
    const rows = hl.map((h, i) => `<li data-fi="${i}"><div class="f-hd"><p class="fk"><i class="mc" aria-hidden="true"></i>${T('en.feature')} ${pad2(i + 1)}</p>
      ${PF.link({ href: deckUrl(p, PF.deckSceneFor(p, h.section)), label: T('page.see-in-deck'), kind: 'page', cls: 'go',
        attrs: `aria-label="${esc(PF.normTitle(h.title))} — ${T('page.see-in-deck')} (새 탭)"` })}</div><h3>${inline(h.title)}</h3>${h.what ? `<p>${inline(h.what)}</p>` : ''}</li>`).join('');
    const no = t('page.project-no', { no: pad2(j + 1), total: pad2(total) });
    return `<section id="p-${esc(p.id)}-core" class="sec core" style="${T3Carts.vars(shell)}--p-acc:${shell.ink};"><div class="wrap">
      ${head(`${no} · ${t('page.features')}`, p.title, PF.teamLabel(p.team), shell.shell)}
      <div class="fe${shots.length ? '' : ' noshot'}">${shots.length ? `<div class="shots rv">${tiles}</div>` : ''}
        <div class="fe-r rv"><ol class="flist">${rows}</ol>
          <div class="btns end">${btn(deckUrl(p), `<span class="play" aria-hidden="true"></span>${T('page.deck-all')}`, 'page', 'btn pri')}${btn(docUrl(p), T('name.doc'), 'page')}</div></div></div></div></section>`;
  }

  // ── 움직임 ──
  function bind() {
    const main = document.getElementById('main');
    if (!main) return;

    // 지금 보는 절 → 위 메뉴에 금속 접점 표시(프로젝트 절은 모두 "프로젝트")
    const navA = [...document.querySelectorAll('[data-nav]')];
    const secs = [...main.querySelectorAll(':scope > section[id], :scope > footer[id]')];
    const navFor = (id) => (/^p-/.test(id) ? navA.find((a) => /^p-/.test(a.dataset.nav)) : navA.find((a) => a.dataset.nav === id));
    let tick = false;
    const mark = () => {
      tick = false;
      let cur = secs[0] && secs[0].id;
      secs.forEach((s) => { if (s.getBoundingClientRect().top <= 140) cur = s.id; });
      if (innerHeight + scrollY >= root.scrollHeight - 4 && secs.length) cur = secs[secs.length - 1].id;
      const a = navFor(cur);
      navA.forEach((x) => { if (x === a) x.setAttribute('aria-current', 'true'); else x.removeAttribute('aria-current'); });
    };
    addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(mark); } }, { passive: true });
    mark();

    // 나타나기: 화면 밖에서 시작하는 것만(처음 화면에 있는 것은 바로 보임). 인쇄 전에는 모두 보이게
    if (!reduced() && 'IntersectionObserver' in window) {
      const items = [...document.querySelectorAll('.rv')].filter((el) => el.getBoundingClientRect().top > innerHeight);
      if (items.length) {
        root.classList.add('rv-on');
        document.querySelectorAll('.rv').forEach((el) => { if (!items.includes(el)) el.classList.add('in'); });
        const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
        items.forEach((el) => io.observe(el));
        addEventListener('beforeprint', () => document.querySelectorAll('.rv').forEach((el) => el.classList.add('in')));
      }
    }

    // 카트리지 기울이기(마우스로 올렸을 때만)
    if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reduced()) {
      document.querySelectorAll('[data-tilt]').forEach((c) => {
        const sh = c.querySelector('.cart-shell');
        c.addEventListener('pointermove', (e) => {
          const r = c.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
          sh.style.setProperty('--ry', `${(x * 7).toFixed(2)}deg`);
          sh.style.setProperty('--rx', `${(-y * 5).toFixed(2)}deg`);
        });
        c.addEventListener('pointerleave', () => { sh.style.removeProperty('--rx'); sh.style.removeProperty('--ry'); });
      });
    }

    // 카트리지를 누르면 꽂히듯 내려감(발표 덱은 새 탭)
    document.querySelectorAll('a.cart').forEach((c) => c.addEventListener('click', () => {
      if (reduced()) return;
      c.classList.remove('inserting'); void c.offsetWidth; c.classList.add('inserting');
    }));

    // 기능 ↔ 화면 짝 강조(마우스 · 키보드 포커스)
    document.querySelectorAll('.fe').forEach((box) => {
      const pair = (el, on) => {
        const it = el.closest && el.closest('[data-fi]');
        if (!it) return;
        box.querySelectorAll(`[data-fi="${it.dataset.fi}"]`).forEach((x) => x.classList.toggle('on', on));
      };
      box.addEventListener('pointerover', (e) => pair(e.target, true));
      box.addEventListener('pointerout', (e) => pair(e.target, false));
      box.addEventListener('focusin', (e) => pair(e.target, true));
      box.addEventListener('focusout', (e) => pair(e.target, false));
    });

    dock();
    lightbox();

    // [PDF로 저장] = 원본 포트폴리오 문서(A4 제출용)를 보이지 않는 틀에 불러 인쇄
    const pdf = document.querySelector('[data-pdf]');
    if (pdf) pdf.addEventListener('click', async () => {
      if (pdf.getAttribute('aria-busy') === 'true') return;
      const label = pdf.textContent;
      pdf.setAttribute('aria-busy', 'true');
      pdf.textContent = t('ui.preparing');
      try { await printOriginal(); }
      catch (e) { info.errors.push(`pdf: ${e.message}`); alert(e.message); }
      finally { pdf.removeAttribute('aria-busy'); pdf.textContent = label; }
    });
  }

  // ── 한눈에 보기: 선반의 카트리지를 슬롯에 꽂기(누르기 · 끌어다 놓기 · Enter) → 옆 칸에 요약, [EJECT]로 꺼내기 ──
  function dock() {
    const sec = document.getElementById('glance');
    if (!sec || !G.projects.length) return;
    const rack = sec.querySelector('.rack'), con = sec.querySelector('.console'), bay = sec.querySelector('.bay'), seat = sec.querySelector('.seat');
    const box = sec.querySelector('.info'), ej = sec.querySelector('.eject');
    const items = [...rack.querySelectorAll('.rk')], btns = [...rack.querySelectorAll('.rk-cart')];
    const moving = () => !reduced();
    let cur = -1, seq = 0;
    const pick = (p, re) => (p.meta || []).find((m) => re.test(m.label || ''));
    const empty = () => { box.removeAttribute('style'); box.innerHTML = '<p class="info-empty">카트리지를 꽂으면<br>프로젝트 요약이 나옵니다</p>'; };
    // 요약 = 원본 "한눈에 보기"와 같은 항목(제목 · 한 줄 소개 · 핵심 기술 · 역할 · 링크) + 장르·기간
    const detail = (i) => {
      const p = G.projects[i];
      const mm = [pick(p, /장르|genre/i), pick(p, /기간|duration|period/i)].filter(Boolean);
      return `<p class="info-no"><span class="no">No.${pad2(i + 1)}</span><span>${esc(PF.teamLabel(p.team))}</span></p>
        <h3${isLatin(p.title) ? ' class="lat"' : ''}>${esc(p.title)}</h3>${p.tagline ? `<p class="tl">${inline(p.tagline)}</p>` : ''}
        ${mm.length ? `<dl class="info-meta">${mm.map((m) => `<div><dt>${esc(m.label)}</dt><dd>${inline(m.value)}</dd></div>`).join('')}</dl>` : ''}
        ${(p.tags || []).length ? `<ul class="tags">${p.tags.slice(0, 5).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${p.team && p.team.role ? `<p class="info-role"><b>${T('name.role-short')}</b>${inline(p.team.role)}</p>` : ''}
        <div class="btns">${btn(deckUrl(p), `<span class="play" aria-hidden="true"></span>${T('name.deck')}`, 'page', 'btn pri')}${btn(docUrl(p), T('name.doc-short'), 'page')}
          ${isUrl(p.links && p.links.github) ? btn(p.links.github, 'GitHub', 'external') : ''}<a class="btn" href="#p-${esc(p.id)}">${T('en.project')} <span aria-hidden="true">↓</span></a></div>`;
    };
    function insert(i, { quiet = false } = {}) {
      if (i === cur || !btns[i]) return;
      const tok = ++seq;
      const go = () => {
        if (tok !== seq) return;
        cur = i;
        items.forEach((li, j) => li.classList.toggle('out', j === i));          // 꽂은 카트리지 자리는 빈 칸, 먼저 꽂혀 있던 것은 선반으로
        btns.forEach((b, j) => { b.setAttribute('aria-pressed', String(j === i)); b.tabIndex = j === i ? -1 : 0; });   // 빈 칸(안 보이는 단추)에는 Tab이 멈추지 않게
        seat.innerHTML = btns[i].innerHTML;
        seat.classList.remove('outgo', 'in');
        if (!quiet && moving()) { void seat.offsetWidth; seat.classList.add('in'); }
        bay.classList.add('full'); con.classList.add('on'); ej.disabled = false;
        const s = G.shells[i];
        box.setAttribute('style', `${T3Carts.vars(s)}--p-acc:${s.ink};`);
        box.innerHTML = detail(i);
        if (!quiet && moving()) { box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
      };
      if (cur >= 0 && !quiet && moving()) { seat.classList.remove('in'); seat.classList.add('outgo'); setTimeout(go, 260); } else go();
    }
    function eject() {
      if (cur < 0) return;
      const i = cur, tok = ++seq;
      cur = -1;
      items[i].classList.remove('out'); btns[i].setAttribute('aria-pressed', 'false'); btns[i].tabIndex = 0;
      const fin = () => { if (tok !== seq) return; seat.innerHTML = ''; seat.classList.remove('outgo'); bay.classList.remove('full'); };
      if (moving()) { seat.classList.remove('in'); seat.classList.add('outgo'); setTimeout(fin, 320); } else fin();
      con.classList.remove('on'); ej.disabled = true; empty();
      btns[i].focus({ preventScroll: true });
    }
    ej.addEventListener('click', eject);

    // 누르기(끌지 않았을 때) · 키보드 Enter/Space(단추 기본 동작) → 꽂기. 키보드로 꽂으면 [EJECT]로 포커스
    rack.addEventListener('click', (e) => {
      const b = e.target.closest('.rk-cart');
      if (!b) return;
      if (b.dataset.dragged) { delete b.dataset.dragged; return; }
      insert(+b.dataset.i);
      if (e.detail === 0) ej.focus({ preventScroll: true });
      const r = box.getBoundingClientRect();
      if (r.top > innerHeight - 120) box.scrollIntoView({ block: 'nearest', behavior: moving() ? 'smooth' : 'auto' });
    });
    // ← → 로 선반 안에서 고르기
    rack.addEventListener('keydown', (e) => {
      const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      const b = e.target.closest('.rk-cart');
      if (!d || !b) return;
      const live = btns.filter((x, j) => j !== cur);
      const k = live.indexOf(b);
      const to = live[k + d];
      if (to) { e.preventDefault(); to.focus(); }
    });

    // 끌어다 놓기(마우스 · 펜. 손가락은 누르기로)
    let drag = null;
    const over = (e) => { const r = con.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
    const end = (e, drop) => {
      const d = drag; drag = null;
      if (!d || !d.moved) return;
      d.b.classList.remove('dragging'); con.classList.remove('drop');
      d.b.dataset.dragged = '1'; setTimeout(() => delete d.b.dataset.dragged, 0);
      d.ghost.remove();
      if (drop && over(e)) insert(d.i);
    };
    rack.addEventListener('pointerdown', (e) => {
      const b = e.target.closest('.rk-cart');
      if (!b || e.button !== 0 || e.pointerType === 'touch') return;
      drag = { b, i: +b.dataset.i, x: e.clientX, y: e.clientY, moved: false, ghost: null, id: e.pointerId };
    });
    addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved) {
        if (Math.hypot(dx, dy) < 8) return;
        const r = drag.b.getBoundingClientRect();
        const g = document.createElement('div');
        g.className = 'ghost'; g.setAttribute('aria-hidden', 'true'); g.innerHTML = drag.b.innerHTML;
        Object.assign(g.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px` });
        document.body.append(g);
        Object.assign(drag, { moved: true, ghost: g, ox: r.left, oy: r.top });
        drag.b.classList.add('dragging');
        try { drag.b.setPointerCapture(e.pointerId); } catch (err) { /* 창 밖에서 놓아도 끝나게(못 잡으면 그대로) */ }
      }
      drag.ghost.style.left = `${drag.ox + dx}px`; drag.ghost.style.top = `${drag.oy + dy}px`;
      con.classList.toggle('drop', over(e));
    });
    addEventListener('pointerup', (e) => { if (drag && e.pointerId === drag.id) end(e, true); });
    addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.id) end(e, false); });
    rack.addEventListener('dragstart', (e) => e.preventDefault());     // 브라우저 기본 끌기(그림·글자) 막기

    empty();
    insert(0, { quiet: true });
  }

  const waitMax = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(r, ms))]);
  let frame = null;
  async function printOriginal() {
    if (!frame) {
      const f = document.createElement('iframe');
      f.title = '인쇄용 포트폴리오 문서'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true');
      Object.assign(f.style, { position: 'fixed', left: '-12000px', top: '0', width: '1200px', height: '900px', border: '0' });
      const loaded = new Promise((res) => { f.onload = res; });
      f.src = '../index.html';
      document.body.appendChild(f);
      await waitMax(loaded, 20000);
      frame = f;
    }
    const w = frame.contentWindow;
    if (!w || !w.PFPage) { frame.remove(); frame = null; throw new Error('원본 포트폴리오 문서(../index.html)를 불러오지 못했습니다'); }
    await waitMax(w.PFPage.whenReady(), 15000);
    const imgs = [...w.document.images];
    imgs.forEach((i) => { i.loading = 'eager'; });
    await waitMax(Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); })))), 15000);
    try { await waitMax(w.document.fonts.ready, 5000); } catch (e) { /* 글꼴 대기 실패는 무시 */ }
    w.focus();
    w.print();
  }

  // ── 화면 크게 보기(같은 프로젝트의 화면끼리 ← →, Esc 닫기) ──
  function lightbox() {
    const dlg = document.createElement('dialog');
    dlg.className = 'lb';
    dlg.setAttribute('aria-label', t('doc.zoom'));
    dlg.innerHTML = `<figure><img alt=""><figcaption></figcaption></figure>
      <button type="button" class="lb-b lb-x" aria-label="${T('ui.close-esc')}">✕</button>
      <button type="button" class="lb-b lb-p" aria-label="${T('ui.prev')}">‹</button><button type="button" class="lb-b lb-n" aria-label="${T('ui.next')}">›</button>`;
    document.body.append(dlg);
    const im = dlg.querySelector('img'), cap = dlg.querySelector('figcaption');
    let list = [], k = 0;
    const show = (i) => {
      k = (i + list.length) % list.length;
      const f = list[k], src = f.querySelector('img');
      im.src = src.currentSrc || src.src; im.alt = src.alt;
      cap.innerHTML = (f.querySelector('figcaption span:last-child') || {}).innerHTML || '';
      dlg.querySelector('.lb-p').hidden = dlg.querySelector('.lb-n').hidden = list.length < 2;
    };
    const open = (f) => { list = [...f.closest('.shots').querySelectorAll('.shot')]; show(list.indexOf(f)); dlg.showModal(); document.body.classList.add('lb-open'); };
    document.addEventListener('click', (e) => { const f = e.target.closest && e.target.closest('.shot'); if (f) open(f); });
    document.addEventListener('keydown', (e) => {
      const f = e.target.closest && e.target.closest('.shot');
      if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(f); }
    });
    dlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.tagName === 'FIGURE') dlg.close(); });
    dlg.querySelector('.lb-x').addEventListener('click', () => dlg.close());
    dlg.querySelector('.lb-p').addEventListener('click', () => show(k - 1));
    dlg.querySelector('.lb-n').addEventListener('click', () => show(k + 1));
    dlg.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(k - 1); else if (e.key === 'ArrowRight') show(k + 1); });
    dlg.addEventListener('close', () => document.body.classList.remove('lb-open'));
  }

  function report() {
    const imgs = [...document.images];
    const secs = [...document.querySelectorAll('main > section[id], main > footer[id]')].map((s) => ({ id: s.id, h: Math.round(s.getBoundingClientRect().height) }));
    return { page: 'temp3', ready: info.ready, errors: [...info.errors], projects: info.projects, sections: secs,
      images: { total: imgs.length, broken: imgs.filter((i) => i.getAttribute('src') && i.complete && !i.naturalWidth).map((i) => i.getAttribute('src')) },
      overflowX: root.scrollWidth > root.clientWidth + 1, strings: PF.stringsReport() };
  }
})();
</script>
